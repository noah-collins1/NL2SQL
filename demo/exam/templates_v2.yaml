- id: v2_implicit_val_po_approval
  family: 23
  difficulty: medium
  question: "What is the purchase order approval rate for {year}?"
  tables: [procurement_po_approvals]
  columns: [procurement_po_approvals.status, procurement_po_approvals.approval_date]
  tags: [procurement, value_mapping]
  gold_sql: |
    SELECT
      ROUND(100.0 * SUM(CASE WHEN status = 'approved' THEN 1 ELSE 0 END) / COUNT(*), 2) AS approval_pct
    FROM {schema}.procurement_po_approvals
    WHERE EXTRACT(YEAR FROM approval_date) = {year};

# ============================================
# Family 24: Cross-module 4+ chain (hard)
# ============================================

- id: v2_cross_mod_order_to_cash
  family: 24
  difficulty: hard
  question: "Order-to-cash pipeline: customers, orders, invoices, and payments for {year}?"
  tables: [customers, sales_orders, order_lines, finance_ar_invoices, finance_ar_payments]
  columns: [customers.name, sales_orders.order_date, finance_ar_payments.payment_date]
  tags: [sales, finance, cross_module]
  gold_sql: |
    SELECT c.name AS customer,
           so.order_id,
           SUM(ol.quantity * ol.unit_price) AS order_total,
           ar.invoice_number,
           ar.amount AS invoice_amount,
           p.payment_date,
           p.amount AS payment_amount
    FROM {schema}.customers c
    JOIN {schema}.sales_orders so ON so.customer_id = c.customer_id
    JOIN {schema}.order_lines ol ON ol.order_id = so.order_id
    JOIN {schema}.finance_ar_invoices ar ON ar.customer_id = c.customer_id
    LEFT JOIN {schema}.finance_ar_payments p ON p.ar_invoice_id = ar.ar_invoice_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY c.name, so.order_id, ar.invoice_number, ar.amount, p.payment_date, p.amount
    LIMIT 50;

- id: v2_cross_mod_procure_to_pay
  family: 24
  difficulty: hard
  question: "Procure-to-pay cycle: PO to goods receipt to vendor invoice by vendor for {year}?"
  tables: [purchase_orders, goods_receipts, vendor_invoices, vendors]
  columns: [purchase_orders.order_date, goods_receipts.receipt_date, vendor_invoices.invoice_date]
  tags: [procurement, cross_module]
  gold_sql: |
    SELECT v.name AS vendor, po.po_id, po.order_date,
           gr.receipt_id, gr.receipt_date,
           vi.invoice_id, vi.invoice_date, vi.total AS invoice_total
    FROM {schema}.purchase_orders po
    JOIN {schema}.goods_receipts gr ON gr.po_id = po.po_id
    JOIN {schema}.vendor_invoices vi ON vi.po_id = po.po_id
    JOIN {schema}.vendors v ON v.vendor_id = po.vendor_id
    WHERE EXTRACT(YEAR FROM po.order_date) = {year}
    ORDER BY po.order_date
    LIMIT 50;

- id: v2_cross_mod_employee_cost_dept
  family: 24
  difficulty: hard
  question: "Total employee cost (gross pay) per department for {year}?"
  tables: [payroll_run_line, payroll_run_hdr, employees, departments]
  columns: [payroll_run_line.gross_pay, employees.department_id, departments.name]
  tags: [hr, finance, cross_module]
  gold_sql: |
    SELECT d.name,
           SUM(prl.gross_pay) AS total_cost,
           COUNT(DISTINCT prl.employee_id) AS employee_count
    FROM {schema}.payroll_run_line prl
    JOIN {schema}.payroll_run_hdr prh ON prh.run_id = prl.run_id
    JOIN {schema}.employees e ON e.employee_id = prl.employee_id
    JOIN {schema}.departments d ON d.department_id = e.department_id
    WHERE EXTRACT(YEAR FROM prh.pay_period_start) = {year}
    GROUP BY d.name
    ORDER BY total_cost DESC;

# ============================================
# Family 25: HAVING filter (medium)
# ============================================

- id: v2_having_dept_headcount
  family: 25
  difficulty: medium
  question: "Departments with more than 50 employees?"
  tables: [employees, departments]
  columns: [employees.department_id, departments.name]
  tags: [hr, having]
  gold_sql: |
    SELECT d.name, COUNT(*) AS headcount
    FROM {schema}.employees e
    JOIN {schema}.departments d ON d.department_id = e.department_id
    WHERE e.termination_date IS NULL
    GROUP BY d.name
    HAVING COUNT(*) > 50;

- id: v2_having_vendors_multi_po
  family: 25
  difficulty: medium
  question: "Vendors with more than 10 purchase orders in {year}?"
  tables: [purchase_orders, vendors]
  columns: [purchase_orders.order_date, vendors.name]
  tags: [procurement, having]
  gold_sql: |
    SELECT v.name, COUNT(*) AS po_count
    FROM {schema}.purchase_orders po
    JOIN {schema}.vendors v ON v.vendor_id = po.vendor_id
    WHERE EXTRACT(YEAR FROM po.order_date) = {year}
    GROUP BY v.name
    HAVING COUNT(*) > 10
    ORDER BY po_count DESC;

- id: v2_having_products_high_volume
  family: 25
  difficulty: medium
  question: "Products with more than {amount} total units sold in {year}?"
  tables: [order_lines, sales_orders, products]
  columns: [order_lines.quantity, products.name]
  tags: [sales, having]
  gold_sql: |
    SELECT p.name, SUM(ol.quantity) AS total_units
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    JOIN {schema}.products p ON p.product_id = ol.product_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY p.name
    HAVING SUM(ol.quantity) > {amount}
    ORDER BY total_units DESC;

- id: v2_having_customers_high_value
  family: 25
  difficulty: medium
  question: "Customers with total order value exceeding {amount} in {year}?"
  tables: [sales_orders, order_lines, customers]
  columns: [order_lines.quantity, order_lines.unit_price, customers.name]
  tags: [sales, having]
  gold_sql: |
    SELECT c.name, SUM(ol.quantity * ol.unit_price) AS total_value
    FROM {schema}.sales_orders so
    JOIN {schema}.order_lines ol ON ol.order_id = so.order_id
    JOIN {schema}.customers c ON c.customer_id = so.customer_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY c.name
    HAVING SUM(ol.quantity * ol.unit_price) > {amount}
    ORDER BY total_value DESC;

# ============================================
# Family 26: CASE bucketing (hard)
# ============================================

- id: v2_case_vendor_spend_class
  family: 26
  difficulty: hard
  question: "Classify vendors as strategic, preferred, or standard based on total spend in {year}?"
  tables: [purchase_orders, vendors]
  columns: [purchase_orders.total, vendors.name]
  tags: [procurement, case_bucket]
  gold_sql: |
    SELECT v.name, SUM(po.total) AS total_spend,
      CASE
        WHEN SUM(po.total) > 100000 THEN 'strategic'
        WHEN SUM(po.total) > 25000 THEN 'preferred'
        ELSE 'standard'
      END AS classification
    FROM {schema}.purchase_orders po
    JOIN {schema}.vendors v ON v.vendor_id = po.vendor_id
    WHERE EXTRACT(YEAR FROM po.order_date) = {year}
    GROUP BY v.name
    ORDER BY total_spend DESC;

- id: v2_case_aged_ar_buckets
  family: 26
  difficulty: hard
  question: "Aged AR receivables in buckets (0-30, 31-60, 61-90, 90+) for {year}?"
  tables: [finance_ar_invoices]
  columns: [finance_ar_invoices.due_date, finance_ar_invoices.amount, finance_ar_invoices.status]
  tags: [finance, case_bucket]
  gold_sql: |
    SELECT
      CASE
        WHEN CURRENT_DATE - due_date <= 30 THEN '0-30'
        WHEN CURRENT_DATE - due_date <= 60 THEN '31-60'
        WHEN CURRENT_DATE - due_date <= 90 THEN '61-90'
        ELSE '90+'
      END AS aging_bucket,
      COUNT(*) AS invoice_count,
      SUM(amount) AS total_amount
    FROM {schema}.finance_ar_invoices
    WHERE status = 'open'
      AND EXTRACT(YEAR FROM invoice_date) = {year}
    GROUP BY aging_bucket
    ORDER BY aging_bucket;

- id: v2_case_customer_segment
  family: 26
  difficulty: hard
  question: "Segment customers by credit limit: premium, standard, or basic?"
  tables: [customers]
  columns: [customers.credit_limit, customers.name]
  tags: [sales, case_bucket]
  gold_sql: |
    SELECT
      CASE
        WHEN credit_limit > 50000 THEN 'premium'
        WHEN credit_limit > 10000 THEN 'standard'
        ELSE 'basic'
      END AS segment,
      COUNT(*) AS customer_count,
      ROUND(AVG(credit_limit), 2) AS avg_credit_limit
    FROM {schema}.customers
    GROUP BY segment
    ORDER BY avg_credit_limit DESC;

# ============================================
# Family 27: Dirty naming (medium)
# ============================================

- id: v2_dirty_mfg_wo_status
  family: 27
  difficulty: medium
  question: "Work order count by status in manufacturing division {schema}?"
  tables: [xx_mfg_wo, lookup_codes]
  columns: [xx_mfg_wo.sts_cd, lookup_codes.meaning]
  tags: [manufacturing, dirty_naming, lookup]
  archetype: manufacturing
  gold_sql: |
    SELECT lc.meaning AS status, COUNT(*) AS wo_count
    FROM {schema}.xx_mfg_wo wo
    JOIN {schema}.lookup_codes lc ON lc.code = wo.sts_cd AND lc.domain = 'WO_STATUS'
    GROUP BY lc.meaning
    ORDER BY wo_count DESC;

- id: v2_dirty_svc_sow_value
  family: 27
  difficulty: medium
  question: "Total contract value by customer for services division {schema}?"
  tables: [zz_svc_sow, customers]
  columns: [zz_svc_sow.tot_amt, zz_svc_sow.cust_nbr, customers.name]
  tags: [services, dirty_naming]
  archetype: services
  gold_sql: |
    SELECT c.name, SUM(sow.tot_amt) AS total_value, COUNT(*) AS sow_count
    FROM {schema}.zz_svc_sow sow
    JOIN {schema}.customers c ON c.customer_id = sow.cust_nbr
    GROUP BY c.name
    ORDER BY total_value DESC
    LIMIT 10;

- id: v2_dirty_rtl_pos_sales
  family: 27
  difficulty: medium
  question: "Total POS sales by payment method for retail division {schema}?"
  tables: [zz_pos_trnx]
  columns: [zz_pos_trnx.pay_mthd_cd, zz_pos_trnx.tot_amt]
  tags: [retail, dirty_naming]
  archetype: retail
  gold_sql: |
    SELECT pay_mthd_cd, COUNT(*) AS txn_count,
           SUM(tot_amt) AS total_sales
    FROM {schema}.zz_pos_trnx
    GROUP BY pay_mthd_cd
    ORDER BY total_sales DESC;

# ============================================
# Family 28: Date arithmetic (medium)
# ============================================

- id: v2_date_po_to_receipt
  family: 28
  difficulty: medium
  question: "Average days from PO to goods receipt by vendor in {year}?"
  tables: [purchase_orders, goods_receipts, vendors]
  columns: [purchase_orders.order_date, goods_receipts.receipt_date, vendors.name]
  tags: [procurement, date_arithmetic]
  gold_sql: |
    SELECT v.name, ROUND(AVG(gr.receipt_date - po.order_date), 2) AS avg_days
    FROM {schema}.purchase_orders po
    JOIN {schema}.goods_receipts gr ON gr.po_id = po.po_id
    JOIN {schema}.vendors v ON v.vendor_id = po.vendor_id
    WHERE EXTRACT(YEAR FROM po.order_date) = {year}
    GROUP BY v.name
    ORDER BY avg_days;

- id: v2_date_rfq_response
  family: 28
  difficulty: medium
  question: "Average days from RFQ to vendor response in {year}?"
  tables: [procurement_rfqs, procurement_rfq_responses]
  columns: [procurement_rfqs.rfq_date, procurement_rfq_responses.response_date]
  tags: [procurement, date_arithmetic]
  gold_sql: |
    SELECT ROUND(AVG(r.response_date - q.rfq_date), 2) AS avg_days
    FROM {schema}.procurement_rfqs q
    JOIN {schema}.procurement_rfq_responses r ON r.rfq_id = q.rfq_id
    WHERE EXTRACT(YEAR FROM q.rfq_date) = {year};

- id: v2_date_req_to_po
  family: 28
  difficulty: medium
  question: "Average days from requisition to purchase order for {year}?"
  tables: [purchase_requisitions, purchase_orders]
  columns: [purchase_requisitions.request_date, purchase_orders.order_date]
  tags: [procurement, date_arithmetic]
  gold_sql: |
    SELECT ROUND(AVG(po.order_date - pr.request_date), 2) AS avg_days
    FROM {schema}.purchase_requisitions pr
    JOIN {schema}.purchase_orders po ON po.requisition_id = pr.requisition_id
    WHERE EXTRACT(YEAR FROM pr.request_date) = {year};

- id: v2_date_vendor_invoice_aging
  family: 28
  difficulty: medium
  question: "Average days between vendor invoice date and due date by vendor?"
  tables: [vendor_invoices, vendors]
  columns: [vendor_invoices.invoice_date, vendor_invoices.due_date]
  tags: [procurement, date_arithmetic]
  gold_sql: |
    SELECT v.name, ROUND(AVG(vi.due_date - vi.invoice_date)::numeric, 2) AS avg_days
    FROM {schema}.vendor_invoices vi
    JOIN {schema}.vendors v ON v.vendor_id = vi.vendor_id
    GROUP BY v.name
    ORDER BY avg_days DESC;

# ============================================
# Family 29: Rate calculation (medium)
# ============================================

- id: v2_rate_sla_resolution
  family: 29
  difficulty: medium
  question: "Average time to close support cases in {year}?"
  tables: [cust_srv_case]
  columns: [cust_srv_case.opened_at, cust_srv_case.updated_at]
  tags: [support, rate]
  gold_sql: |
    SELECT ROUND(AVG(EXTRACT(EPOCH FROM (updated_at - opened_at)) / 3600), 2) AS avg_close_hours
    FROM {schema}.cust_srv_case
    WHERE status = 'closed'
      AND EXTRACT(YEAR FROM opened_at) = {year};

- id: v2_rate_qc_fail
  family: 29
  difficulty: medium
  question: "QC failure rate for inventory inspections in {year}?"
  tables: [inventory_qc_inspections]
  columns: [inventory_qc_inspections.result, inventory_qc_inspections.inspection_date]
  tags: [inventory, rate]
  gold_sql: |
    SELECT
      ROUND(100.0 * SUM(CASE WHEN result = 'fail' THEN 1 ELSE 0 END) / COUNT(*), 2) AS fail_pct
    FROM {schema}.inventory_qc_inspections
    WHERE EXTRACT(YEAR FROM inspection_date) = {year};

- id: v2_rate_quote_conversion
  family: 29
  difficulty: medium
  question: "Quote-to-order conversion rate for {year}?"
  tables: [sales_quotes, sales_orders]
  columns: [sales_quotes.quote_date, sales_orders.order_date]
  tags: [sales, rate]
  gold_sql: |
    SELECT
      ROUND(100.0 * COUNT(DISTINCT so.order_id) / NULLIF(COUNT(DISTINCT sq.quote_id),0), 2) AS conversion_pct
    FROM {schema}.sales_quotes sq
    LEFT JOIN {schema}.sales_orders so ON so.customer_id = sq.customer_id
    WHERE EXTRACT(YEAR FROM sq.quote_date) = {year};

- id: v2_rate_employee_utilization
  family: 29
  difficulty: medium
  question: "Employee utilization rate by week in {year}?"
  tables: [timesheet_entries, timesheets, employees]
  columns: [timesheet_entries.hours, timesheets.week_start_date]
  tags: [projects, hr, rate]
  gold_sql: |
    SELECT e.employee_id, DATE_TRUNC('week', t.week_start_date) AS week_start,
           ROUND(SUM(te.hours) / 40.0, 2) AS utilization
    FROM {schema}.timesheets t
    JOIN {schema}.timesheet_entries te ON te.timesheet_id = t.timesheet_id
    JOIN {schema}.employees e ON e.employee_id = t.employee_id
    WHERE EXTRACT(YEAR FROM t.week_start_date) = {year}
    GROUP BY e.employee_id, week_start;

# ============================================
# Family 30: Pivoted output (extra_hard)
# ============================================

- id: v2_pivot_quarterly_revenue
  family: 30
  difficulty: extra_hard
  question: "Show {year} revenue as columns Q1, Q2, Q3, Q4?"
  tables: [order_lines, sales_orders]
  columns: [order_lines.quantity, order_lines.unit_price, sales_orders.order_date]
  tags: [sales, pivot]
  gold_sql: |
    SELECT
      SUM(CASE WHEN EXTRACT(QUARTER FROM so.order_date) = 1 THEN ol.quantity * ol.unit_price ELSE 0 END) AS q1,
      SUM(CASE WHEN EXTRACT(QUARTER FROM so.order_date) = 2 THEN ol.quantity * ol.unit_price ELSE 0 END) AS q2,
      SUM(CASE WHEN EXTRACT(QUARTER FROM so.order_date) = 3 THEN ol.quantity * ol.unit_price ELSE 0 END) AS q3,
      SUM(CASE WHEN EXTRACT(QUARTER FROM so.order_date) = 4 THEN ol.quantity * ol.unit_price ELSE 0 END) AS q4
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year};

- id: v2_pivot_monthly_hires
  family: 30
  difficulty: extra_hard
  question: "Number of hires per month in {year} displayed as columns Jan through Dec?"
  tables: [employees]
  columns: [employees.hire_date]
  tags: [hr, pivot]
  gold_sql: |
    SELECT
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 1 THEN 1 ELSE 0 END) AS jan,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 2 THEN 1 ELSE 0 END) AS feb,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 3 THEN 1 ELSE 0 END) AS mar,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 4 THEN 1 ELSE 0 END) AS apr,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 5 THEN 1 ELSE 0 END) AS may,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 6 THEN 1 ELSE 0 END) AS jun,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 7 THEN 1 ELSE 0 END) AS jul,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 8 THEN 1 ELSE 0 END) AS aug,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 9 THEN 1 ELSE 0 END) AS sep,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 10 THEN 1 ELSE 0 END) AS oct,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 11 THEN 1 ELSE 0 END) AS nov,
      SUM(CASE WHEN EXTRACT(MONTH FROM hire_date) = 12 THEN 1 ELSE 0 END) AS dec
    FROM {schema}.employees
    WHERE EXTRACT(YEAR FROM hire_date) = {year};

# ============================================
# Family 31: Recursive CTE (extra_hard)
# ============================================

- id: v2_recursive_dept_hierarchy
  family: 31
  difficulty: extra_hard
  question: "All sub-departments under Finance at any level?"
  tables: [departments]
  columns: [departments.department_id, departments.name, departments.parent_department_id]
  tags: [hr, recursive, hierarchy]
  gold_sql: |
    WITH RECURSIVE dept_tree AS (
      SELECT department_id, name, parent_department_id, 1 AS level
      FROM {schema}.departments
      WHERE name = 'Finance'
      UNION ALL
      SELECT d.department_id, d.name, d.parent_department_id, dt.level + 1
      FROM {schema}.departments d
      JOIN dept_tree dt ON dt.department_id = d.parent_department_id
    )
    SELECT name, level
    FROM dept_tree
    WHERE level > 1
    ORDER BY level, name;

- id: v2_recursive_bu_hierarchy
  family: 31
  difficulty: extra_hard
  question: "Full business unit hierarchy from the top level?"
  tables: [business_units]
  columns: [business_units.unit_id, business_units.name, business_units.parent_unit_id]
  tags: [admin, recursive, hierarchy]
  gold_sql: |
    WITH RECURSIVE bu_tree AS (
      SELECT unit_id, name, parent_unit_id, 1 AS level
      FROM {schema}.business_units
      WHERE parent_unit_id IS NULL
      UNION ALL
      SELECT bu.unit_id, bu.name, bu.parent_unit_id, bt.level + 1
      FROM {schema}.business_units bu
      JOIN bu_tree bt ON bt.unit_id = bu.parent_unit_id
    )
    SELECT name, level
    FROM bu_tree
    ORDER BY level, name;

# ============================================
# Family 32: Scalar correlated subquery (hard)
# ============================================

- id: v2_scalar_corr_late_deliveries
  family: 32
  difficulty: hard
  question: "Vendors with more than 3 late deliveries in {year}?"
  tables: [purchase_orders, goods_receipts, vendors]
  columns: [purchase_orders.order_date, goods_receipts.receipt_date]
  tags: [procurement, correlated_subquery]
  gold_sql: |
    SELECT v.vendor_id, v.name,
           (SELECT COUNT(*)
            FROM {schema}.purchase_orders po
            JOIN {schema}.goods_receipts gr ON gr.po_id = po.po_id
            WHERE po.vendor_id = v.vendor_id
              AND gr.receipt_date > po.order_date + 14
              AND EXTRACT(YEAR FROM po.order_date) = {year}
           ) AS late_count
    FROM {schema}.vendors v
    WHERE (SELECT COUNT(*)
           FROM {schema}.purchase_orders po
           JOIN {schema}.goods_receipts gr ON gr.po_id = po.po_id
           WHERE po.vendor_id = v.vendor_id
             AND gr.receipt_date > po.order_date + 14
             AND EXTRACT(YEAR FROM po.order_date) = {year}
          ) > 3;

- id: v2_scalar_corr_depts_over_budget
  family: 32
  difficulty: hard
  question: "Departments where actual expenses exceed budget?"
  tables: [budgets, project_expenses, departments]
  columns: [budgets.total_amount, project_expenses.amount]
  tags: [finance, correlated_subquery]
  gold_sql: |
    SELECT d.name, b.total_amount AS budget,
           (SELECT COALESCE(SUM(pe.amount), 0)
            FROM {schema}.project_expenses pe
            JOIN {schema}.projects p ON p.project_id = pe.project_id
            WHERE p.customer_id IS NOT NULL
           ) AS actual_spend
    FROM {schema}.budgets b
    JOIN {schema}.departments d ON d.department_id = b.department_id
    WHERE b.total_amount < (
      SELECT COALESCE(SUM(pe.amount), 0)
      FROM {schema}.project_expenses pe
    );

# ============================================
# Family 33: Multi-hop hidden path (extra_hard)
# ============================================

- id: v2_multihop_customer_country
  family: 33
  difficulty: extra_hard
  question: "What country are our highest-revenue customers from?"
  tables: [customers, addresses, cities, states_provinces, countries, sales_orders, order_lines]
  columns: [customers.billing_address_id, countries.name]
  tags: [sales, geography, multi_hop]
  gold_sql: |
    SELECT co.name AS country, c.name AS customer,
           SUM(ol.quantity * ol.unit_price) AS revenue
    FROM {schema}.customers c
    JOIN {schema}.sales_orders so ON so.customer_id = c.customer_id
    JOIN {schema}.order_lines ol ON ol.order_id = so.order_id
    LEFT JOIN {schema}.addresses a ON a.address_id = c.billing_address_id
    LEFT JOIN {schema}.cities ci ON ci.city_id = a.city_id
    LEFT JOIN {schema}.states_provinces sp ON sp.state_id = ci.state_id
    LEFT JOIN {schema}.countries co ON co.country_id = sp.country_id
    GROUP BY co.name, c.name
    ORDER BY revenue DESC
    LIMIT 10;

- id: v2_multihop_sales_by_state
  family: 33
  difficulty: extra_hard
  question: "Sales order count by state for {year}?"
  tables: [sales_orders, customers, addresses, cities, states_provinces]
  columns: [sales_orders.order_date, states_provinces.name]
  tags: [sales, geography, multi_hop]
  gold_sql: |
    SELECT s.name AS state, COUNT(*) AS order_count
    FROM {schema}.sales_orders so
    JOIN {schema}.customers c ON c.customer_id = so.customer_id
    LEFT JOIN {schema}.addresses a ON a.address_id = c.billing_address_id
    LEFT JOIN {schema}.cities ci ON ci.city_id = a.city_id
    LEFT JOIN {schema}.states_provinces s ON s.state_id = ci.state_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY s.name
    ORDER BY order_count DESC;

# ============================================
# Family 34: Year-over-year comparison (hard)
# ============================================

- id: v2_yoy_sales_growth
  family: 34
  difficulty: hard
  question: "Year-over-year sales growth comparing {year} to the prior year?"
  tables: [order_lines, sales_orders]
  columns: [order_lines.quantity, order_lines.unit_price, sales_orders.order_date]
  tags: [sales, temporal, yoy]
  gold_sql: |
    WITH yearly AS (
      SELECT EXTRACT(YEAR FROM so.order_date) AS yr,
             SUM(ol.quantity * ol.unit_price) AS total_sales
      FROM {schema}.order_lines ol
      JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
      WHERE EXTRACT(YEAR FROM so.order_date) IN ({year}, {year} - 1)
      GROUP BY yr
    )
    SELECT
      cur.total_sales AS current_year_sales,
      prev.total_sales AS prior_year_sales,
      ROUND(100.0 * (cur.total_sales - prev.total_sales) / NULLIF(prev.total_sales, 0), 2) AS growth_pct
    FROM yearly cur
    JOIN yearly prev ON cur.yr = prev.yr + 1;

- id: v2_yoy_po_volume
  family: 34
  difficulty: hard
  question: "Year-over-year purchase order count change comparing {year} vs prior year?"
  tables: [purchase_orders]
  columns: [purchase_orders.order_date]
  tags: [procurement, temporal, yoy]
  gold_sql: |
    WITH yearly AS (
      SELECT EXTRACT(YEAR FROM order_date) AS yr, COUNT(*) AS po_count
      FROM {schema}.purchase_orders
      WHERE EXTRACT(YEAR FROM order_date) IN ({year}, {year} - 1)
      GROUP BY yr
    )
    SELECT
      cur.po_count AS current_year,
      prev.po_count AS prior_year,
      cur.po_count - prev.po_count AS change,
      ROUND(100.0 * (cur.po_count - prev.po_count) / NULLIF(prev.po_count, 0), 2) AS change_pct
    FROM yearly cur
    JOIN yearly prev ON cur.yr = prev.yr + 1;

- id: v2_yoy_headcount
  family: 34
  difficulty: hard
  question: "Year-over-year headcount comparison for {year} vs prior year?"
  tables: [employees]
  columns: [employees.hire_date, employees.termination_date]
  tags: [hr, temporal, yoy]
  gold_sql: |
    WITH yearly AS (
      SELECT {year} AS yr, COUNT(*) AS hc
      FROM {schema}.employees
      WHERE hire_date <= DATE '{year}-12-31'
        AND (termination_date IS NULL OR termination_date > DATE '{year}-01-01')
      UNION ALL
      SELECT {year} - 1 AS yr, COUNT(*) AS hc
      FROM {schema}.employees
      WHERE hire_date <= DATE '{year}-01-01'
        AND (termination_date IS NULL OR termination_date > DATE (({year}-1)::TEXT || '-01-01'))
    )
    SELECT * FROM yearly ORDER BY yr;

# ============================================
# Family 35: Mixed aggregation levels (hard)
# ============================================

- id: v2_mixed_agg_salary_vs_dept_avg
  family: 35
  difficulty: hard
  question: "Each employee's salary alongside their department average?"
  tables: [employees, employee_salaries, departments]
  columns: [employee_salaries.amount, employees.department_id, departments.name]
  tags: [hr, mixed_aggregation]
  gold_sql: |
    SELECT e.first_name, e.last_name, d.name AS department,
           es.amount AS salary,
           AVG(es.amount) OVER (PARTITION BY e.department_id) AS dept_avg_salary
    FROM {schema}.employees e
    JOIN {schema}.employee_salaries es ON es.employee_id = e.employee_id
    JOIN {schema}.departments d ON d.department_id = e.department_id;

- id: v2_mixed_agg_order_vs_customer_avg
  family: 35
  difficulty: hard
  question: "Each order total alongside the customer's average order value for {year}?"
  tables: [sales_orders, order_lines, customers]
  columns: [order_lines.quantity, order_lines.unit_price, customers.name]
  tags: [sales, mixed_aggregation]
  gold_sql: |
    WITH order_totals AS (
      SELECT so.order_id, so.customer_id, SUM(ol.quantity * ol.unit_price) AS order_total
      FROM {schema}.sales_orders so
      JOIN {schema}.order_lines ol ON ol.order_id = so.order_id
      WHERE EXTRACT(YEAR FROM so.order_date) = {year}
      GROUP BY so.order_id, so.customer_id
    )
    SELECT c.name AS customer, ot.order_id, ot.order_total,
           AVG(ot.order_total) OVER (PARTITION BY ot.customer_id) AS customer_avg
    FROM order_totals ot
    JOIN {schema}.customers c ON c.customer_id = ot.customer_id
    ORDER BY c.name, ot.order_id;

- id: v2_mixed_agg_expense_vs_project_avg
  family: 35
  difficulty: hard
  question: "Each project expense alongside the project's average expense?"
  tables: [project_expenses, projects]
  columns: [project_expenses.amount, projects.name]
  tags: [projects, mixed_aggregation]
  gold_sql: |
    SELECT p.name AS project, pe.expense_date, pe.amount,
           AVG(pe.amount) OVER (PARTITION BY pe.project_id) AS project_avg_expense
    FROM {schema}.project_expenses pe
    JOIN {schema}.projects p ON p.project_id = pe.project_id
    ORDER BY p.name, pe.expense_date;

