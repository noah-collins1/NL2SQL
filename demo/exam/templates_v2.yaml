# Exam v2 question templates — NO evidence hints
# 39 families (35 SQL + 4 ambiguity), 160+ templates
# Difficulty levels: easy, medium, hard, extra_hard, ambiguous

# ============================================
# Family 1: Single-table lookup (easy)
# ============================================

- id: v2_lookup_vendor_terms
  family: 1
  difficulty: easy
  question: "Which vendors have payment terms longer than {payment_terms} days?"
  tables: [vendors]
  columns: [vendors.payment_terms]
  tags: [procurement, lookup]
  gold_sql: |
    SELECT vendor_id, name, payment_terms
    FROM {schema}.vendors
    WHERE payment_terms > {payment_terms};

- id: v2_lookup_inactive_vendors
  family: 1
  difficulty: easy
  question: "List all inactive vendors."
  tables: [vendors]
  columns: [vendors.is_active]
  tags: [procurement, lookup]
  gold_sql: |
    SELECT vendor_id, name
    FROM {schema}.vendors
    WHERE is_active = FALSE;

- id: v2_lookup_high_credit_customers
  family: 1
  difficulty: easy
  question: "Show customers with a credit limit above {amount}."
  tables: [customers]
  columns: [customers.credit_limit]
  tags: [sales, lookup]
  gold_sql: |
    SELECT customer_id, name, credit_limit
    FROM {schema}.customers
    WHERE credit_limit > {amount};

- id: v2_lookup_open_opportunities
  family: 1
  difficulty: easy
  question: "List open sales opportunities with probability over {prob}."
  tables: [sales_opportunities]
  columns: [sales_opportunities.probability]
  tags: [sales, lookup]
  gold_sql: |
    SELECT opportunity_id, name, amount, probability
    FROM {schema}.sales_opportunities
    WHERE probability > {prob};

- id: v2_lookup_overdue_onboarding
  family: 1
  difficulty: easy
  question: "Show onboarding tasks that are overdue."
  tables: [hr_onboarding_tasks]
  columns: [hr_onboarding_tasks.status, hr_onboarding_tasks.due_date]
  tags: [hr, lookup]
  gold_sql: |
    SELECT task_id, employee_id, task_name, due_date, status
    FROM {schema}.hr_onboarding_tasks
    WHERE status <> 'done'
      AND due_date < CURRENT_DATE;

# ============================================
# Family 2: Single-table aggregation (easy)
# ============================================

- id: v2_agg_orders_by_month
  family: 2
  difficulty: easy
  question: "How many sales orders were placed each month in {year}?"
  tables: [sales_orders]
  columns: [sales_orders.order_date]
  tags: [sales, aggregation]
  gold_sql: |
    SELECT DATE_TRUNC('month', order_date) AS month, COUNT(*) AS order_count
    FROM {schema}.sales_orders
    WHERE EXTRACT(YEAR FROM order_date) = {year}
    GROUP BY month
    ORDER BY month;

- id: v2_agg_journal_entries_monthly
  family: 2
  difficulty: easy
  question: "Number of journal entries by month in {year}?"
  tables: [journal_entries]
  columns: [journal_entries.entry_date]
  tags: [finance, aggregation]
  gold_sql: |
    SELECT DATE_TRUNC('month', entry_date) AS month, COUNT(*) AS entry_count
    FROM {schema}.journal_entries
    WHERE EXTRACT(YEAR FROM entry_date) = {year}
    GROUP BY month
    ORDER BY month;

- id: v2_agg_orders_by_status
  family: 2
  difficulty: easy
  question: "Sales order counts by status for {year}?"
  tables: [sales_orders]
  columns: [sales_orders.status, sales_orders.order_date]
  tags: [sales, aggregation]
  gold_sql: |
    SELECT status, COUNT(*) AS order_count
    FROM {schema}.sales_orders
    WHERE EXTRACT(YEAR FROM order_date) = {year}
    GROUP BY status;

- id: v2_agg_adjustments_by_reason
  family: 2
  difficulty: easy
  question: "Count of inventory adjustments by reason in {year}?"
  tables: [inventory_adjustments]
  columns: [inventory_adjustments.reason, inventory_adjustments.adjustment_date]
  tags: [inventory, aggregation]
  gold_sql: |
    SELECT reason, COUNT(*) AS adjustment_count
    FROM {schema}.inventory_adjustments
    WHERE EXTRACT(YEAR FROM adjustment_date) = {year}
    GROUP BY reason;

- id: v2_agg_bank_tx_by_type
  family: 2
  difficulty: easy
  question: "What are the bank transaction totals by type for {year}?"
  tables: [bank_transactions]
  columns: [bank_transactions.transaction_type, bank_transactions.amount, bank_transactions.transaction_date]
  tags: [finance, aggregation]
  gold_sql: |
    SELECT transaction_type, SUM(amount) AS total_amount
    FROM {schema}.bank_transactions
    WHERE EXTRACT(YEAR FROM transaction_date) = {year}
    GROUP BY transaction_type;

# ============================================
# Family 3: Two-table JOIN + value grounding (medium)
# ============================================

- id: v2_join_val_dept_manager
  family: 3
  difficulty: medium
  question: "Who is the manager of the Engineering department?"
  tables: [employees, departments]
  columns: [employees.first_name, employees.last_name, departments.name]
  tags: [hr, value_grounding]
  gold_sql: |
    SELECT e.first_name, e.last_name, e.email
    FROM {schema}.departments d
    JOIN {schema}.employees e ON e.employee_id = d.manager_id
    WHERE d.name = 'Engineering';

- id: v2_join_val_primary_contacts
  family: 3
  difficulty: medium
  question: "Who are the primary contacts for all customers?"
  tables: [customers, customer_contacts]
  columns: [customer_contacts.is_primary, customer_contacts.first_name, customer_contacts.last_name]
  tags: [sales, value_grounding]
  gold_sql: |
    SELECT c.name AS customer, cc.first_name || ' ' || cc.last_name AS contact, cc.email
    FROM {schema}.customers c
    JOIN {schema}.customer_contacts cc ON cc.customer_id = c.customer_id
    WHERE cc.is_primary = TRUE
    ORDER BY c.name;

- id: v2_join_val_benefit_elections
  family: 3
  difficulty: medium
  question: "How many benefit elections by coverage level in {year}?"
  tables: [hr_benefit_elections]
  columns: [hr_benefit_elections.coverage_level, hr_benefit_elections.election_date]
  tags: [hr, value_grounding]
  gold_sql: |
    SELECT coverage_level, COUNT(*) AS elections
    FROM {schema}.hr_benefit_elections
    WHERE EXTRACT(YEAR FROM election_date) = {year}
    GROUP BY coverage_level;

- id: v2_join_val_training_completion
  family: 3
  difficulty: medium
  question: "Training completions by course for {year}?"
  tables: [training_courses, employee_training]
  columns: [employee_training.completion_date]
  tags: [hr, training, value_grounding]
  gold_sql: |
    SELECT c.name, COUNT(*) AS completions
    FROM {schema}.employee_training et
    JOIN {schema}.training_courses c ON c.course_id = et.course_id
    WHERE EXTRACT(YEAR FROM et.completion_date) = {year}
    GROUP BY c.name
    ORDER BY completions DESC;

# ============================================
# Family 4: Two-table TOP-N (medium)
# ============================================

- id: v2_topn_customers_by_sales
  family: 4
  difficulty: medium
  question: "Top 10 customers by total sales amount in {year}?"
  tables: [sales_orders, order_lines, customers]
  columns: [sales_orders.order_date, order_lines.quantity, order_lines.unit_price, customers.name]
  tags: [sales, top_n]
  gold_sql: |
    SELECT c.name, SUM(ol.quantity * ol.unit_price) AS total_sales
    FROM {schema}.sales_orders so
    JOIN {schema}.order_lines ol ON ol.order_id = so.order_id
    JOIN {schema}.customers c ON c.customer_id = so.customer_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY c.name
    ORDER BY total_sales DESC
    LIMIT 10;

- id: v2_topn_vendors_by_spend
  family: 4
  difficulty: medium
  question: "Top 5 vendors by total purchase order spend in {year}?"
  tables: [purchase_orders, vendors]
  columns: [purchase_orders.total, purchase_orders.order_date, vendors.name]
  tags: [procurement, top_n]
  gold_sql: |
    SELECT v.name, SUM(po.total) AS total_spend
    FROM {schema}.purchase_orders po
    JOIN {schema}.vendors v ON v.vendor_id = po.vendor_id
    WHERE EXTRACT(YEAR FROM po.order_date) = {year}
    GROUP BY v.name
    ORDER BY total_spend DESC
    LIMIT 5;

- id: v2_topn_products_by_revenue
  family: 4
  difficulty: medium
  question: "Top 20 products by revenue in {year}?"
  tables: [order_lines, sales_orders, products]
  columns: [order_lines.quantity, order_lines.unit_price, products.name]
  tags: [sales, top_n]
  gold_sql: |
    SELECT p.name, SUM(ol.quantity * ol.unit_price) AS revenue
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    JOIN {schema}.products p ON p.product_id = ol.product_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY p.name
    ORDER BY revenue DESC
    LIMIT 20;

# ============================================
# Family 5: Header-line drill (medium)
# ============================================

- id: v2_hdr_avg_line_price
  family: 5
  difficulty: medium
  question: "What is the average unit price on purchase order lines in Q1 {year}?"
  tables: [purchase_orders, po_lines]
  columns: [po_lines.unit_price, purchase_orders.order_date]
  tags: [procurement, header_line]
  gold_sql: |
    SELECT ROUND(AVG(pl.unit_price), 2) AS avg_unit_price
    FROM {schema}.purchase_orders po
    JOIN {schema}.po_lines pl ON pl.po_id = po.po_id
    WHERE po.order_date >= DATE '{year}-01-01'
      AND po.order_date < DATE '{year}-04-01';

- id: v2_hdr_order_discount
  family: 5
  difficulty: medium
  question: "Average discount percentage on sales order lines in {year}?"
  tables: [order_lines, sales_orders]
  columns: [order_lines.discount_percent, sales_orders.order_date]
  tags: [sales, header_line]
  gold_sql: |
    SELECT ROUND(AVG(ol.discount_percent), 2) AS avg_discount
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year};

- id: v2_hdr_quarterly_revenue
  family: 5
  difficulty: medium
  question: "Quarterly revenue breakdown for {year}?"
  tables: [order_lines, sales_orders]
  columns: [order_lines.quantity, order_lines.unit_price, sales_orders.order_date]
  tags: [sales, header_line]
  gold_sql: |
    SELECT
      EXTRACT(QUARTER FROM so.order_date) AS quarter,
      SUM(ol.quantity * ol.unit_price) AS revenue
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY quarter
    ORDER BY quarter;

- id: v2_hdr_comment_volume
  family: 5
  difficulty: medium
  question: "How many comments per support case in {year}?"
  tables: [support_ticket_comments]
  columns: [support_ticket_comments.comment_ts]
  tags: [support, header_line]
  gold_sql: |
    SELECT case_id, COUNT(*) AS comment_count
    FROM {schema}.support_ticket_comments
    WHERE EXTRACT(YEAR FROM comment_ts) = {year}
    GROUP BY case_id;

# ============================================
# Family 6: Three-table chain (hard)
# ============================================

- id: v2_chain3_revenue_by_category
  family: 6
  difficulty: hard
  question: "Revenue by product category for {year}?"
  tables: [order_lines, sales_orders, products, product_categories]
  columns: [order_lines.quantity, order_lines.unit_price, product_categories.name]
  tags: [sales, multi_join]
  gold_sql: |
    SELECT pc.name AS category, SUM(ol.quantity * ol.unit_price) AS revenue
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    JOIN {schema}.products p ON p.product_id = ol.product_id
    JOIN {schema}.product_categories pc ON pc.category_id = p.category_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY pc.name
    ORDER BY revenue DESC;

- id: v2_chain3_inventory_by_category
  family: 6
  difficulty: hard
  question: "Total inventory units moved by product category in {year}?"
  tables: [inventory_transactions, products, product_categories]
  columns: [inventory_transactions.quantity, inventory_transactions.transaction_date, product_categories.name]
  tags: [inventory, multi_join]
  gold_sql: |
    SELECT pc.name, SUM(it.quantity) AS total_moved
    FROM {schema}.inventory_transactions it
    JOIN {schema}.products p ON p.product_id = it.product_id
    JOIN {schema}.product_categories pc ON pc.category_id = p.category_id
    WHERE EXTRACT(YEAR FROM it.transaction_date) = {year}
    GROUP BY pc.name
    ORDER BY total_moved DESC;

- id: v2_chain3_maintenance_by_category
  family: 6
  difficulty: hard
  question: "Total maintenance cost by asset category in {year}?"
  tables: [asset_maintenance, fixed_assets, asset_categories]
  columns: [asset_maintenance.cost, asset_categories.name]
  tags: [assets, multi_join]
  gold_sql: |
    SELECT ac.name, SUM(am.cost) AS total_cost
    FROM {schema}.asset_maintenance am
    JOIN {schema}.fixed_assets fa ON fa.asset_id = am.asset_id
    JOIN {schema}.asset_categories ac ON ac.category_id = fa.category_id
    WHERE EXTRACT(YEAR FROM am.scheduled_date) = {year}
    GROUP BY ac.name;

- id: v2_chain3_cost_center_spend
  family: 6
  difficulty: hard
  question: "Net journal amounts by cost center for {year}?"
  tables: [journal_lines, cost_centers, journal_entries]
  columns: [journal_lines.debit, journal_lines.credit, journal_entries.entry_date]
  tags: [finance, multi_join]
  gold_sql: |
    SELECT cc.name, SUM(jl.debit - jl.credit) AS net_amount
    FROM {schema}.journal_lines jl
    JOIN {schema}.journal_entries je ON je.entry_id = jl.entry_id
    JOIN {schema}.cost_centers cc ON cc.cost_center_id = jl.cost_center_id
    WHERE EXTRACT(YEAR FROM je.entry_date) = {year}
    GROUP BY cc.name;

# ============================================
# Family 7: Coded lookup decode (medium)
# ============================================

- id: v2_coded_wo_status
  family: 7
  difficulty: medium
  question: "How many work orders are there by status?"
  tables: [mfg_work_orders, lookup_codes]
  columns: [mfg_work_orders.status_code, lookup_codes.meaning]
  tags: [manufacturing, lookup]
  archetype: manufacturing
  gold_sql: |
    SELECT lc.meaning AS status, COUNT(*) AS wo_count
    FROM {schema}.mfg_work_orders wo
    JOIN {schema}.lookup_codes lc ON lc.code = wo.status_code AND lc.domain = 'WO_STATUS'
    GROUP BY lc.meaning
    ORDER BY wo_count DESC;

- id: v2_coded_priority_filter
  family: 7
  difficulty: medium
  question: "Show all high and critical priority work orders."
  tables: [mfg_work_orders, lookup_codes]
  columns: [mfg_work_orders.priority_code, lookup_codes.meaning]
  tags: [manufacturing, lookup]
  archetype: manufacturing
  gold_sql: |
    SELECT wo.work_order_id, wo.work_order_number, lc.meaning AS priority
    FROM {schema}.mfg_work_orders wo
    JOIN {schema}.lookup_codes lc ON lc.code = wo.priority_code AND lc.domain = 'PRIORITY'
    WHERE lc.meaning IN ('High', 'Critical');

- id: v2_coded_sow_status
  family: 7
  difficulty: medium
  question: "Count of statements of work by status?"
  tables: [svc_statements_of_work, lookup_codes]
  columns: [svc_statements_of_work.status_code, lookup_codes.meaning]
  tags: [services, lookup]
  archetype: services
  gold_sql: |
    SELECT lc.meaning AS status, COUNT(*) AS sow_count
    FROM {schema}.svc_statements_of_work sow
    JOIN {schema}.lookup_codes lc ON lc.code = sow.status_code AND lc.domain = 'PROJECT_STATUS'
    GROUP BY lc.meaning
    ORDER BY sow_count DESC;

- id: v2_coded_scrap_reason
  family: 7
  difficulty: medium
  question: "Total scrap quantity by reason code in manufacturing?"
  tables: [mfg_scrap_log]
  columns: [mfg_scrap_log.reason_code, mfg_scrap_log.scrap_quantity]
  tags: [manufacturing, lookup]
  archetype: manufacturing
  gold_sql: |
    SELECT reason_code, SUM(scrap_quantity) AS total_scrap
    FROM {schema}.mfg_scrap_log
    GROUP BY reason_code
    ORDER BY total_scrap DESC;

# ============================================
# Family 8: SCD2 point-in-time (hard)
# ============================================

- id: v2_scd2_salary_at_date
  family: 8
  difficulty: hard
  question: "What was each employee's salary as of June 30, {year}?"
  tables: [employee_salaries, employees]
  columns: [employee_salaries.amount, employee_salaries.effective_date, employees.first_name]
  tags: [hr, temporal, scd2]
  gold_sql: |
    SELECT e.first_name, e.last_name, es.amount AS salary
    FROM {schema}.employees e
    JOIN {schema}.employee_salaries es ON es.employee_id = e.employee_id
    WHERE es.effective_date = (
      SELECT MAX(es2.effective_date)
      FROM {schema}.employee_salaries es2
      WHERE es2.employee_id = e.employee_id
        AND es2.effective_date <= DATE '{year}-06-30'
    );

- id: v2_scd2_active_employees_at_date
  family: 8
  difficulty: hard
  question: "How many employees were active on January 1, {year}?"
  tables: [employees]
  columns: [employees.hire_date, employees.termination_date]
  tags: [hr, temporal, scd2]
  gold_sql: |
    SELECT COUNT(*) AS active_count
    FROM {schema}.employees
    WHERE hire_date <= DATE '{year}-01-01'
      AND (termination_date IS NULL OR termination_date > DATE '{year}-01-01');

- id: v2_scd2_tenure_distribution
  family: 8
  difficulty: hard
  question: "Employee tenure distribution (0-1yr, 1-3yr, 3-5yr, 5+yr) as of end of {year}?"
  tables: [employees]
  columns: [employees.hire_date]
  tags: [hr, temporal, scd2]
  gold_sql: |
    SELECT
      CASE
        WHEN EXTRACT(YEAR FROM AGE(DATE '{year}-12-31', hire_date)) < 1 THEN '0-1 yr'
        WHEN EXTRACT(YEAR FROM AGE(DATE '{year}-12-31', hire_date)) < 3 THEN '1-3 yr'
        WHEN EXTRACT(YEAR FROM AGE(DATE '{year}-12-31', hire_date)) < 5 THEN '3-5 yr'
        ELSE '5+ yr'
      END AS tenure_bucket,
      COUNT(*) AS employee_count
    FROM {schema}.employees
    WHERE hire_date <= DATE '{year}-12-31'
      AND (termination_date IS NULL OR termination_date > DATE '{year}-12-31')
    GROUP BY tenure_bucket
    ORDER BY tenure_bucket;

# ============================================
# Family 9: Anti-join NOT EXISTS (hard)
# ============================================

- id: v2_antijoin_customers_no_orders
  family: 9
  difficulty: hard
  question: "Which customers have never placed a sales order?"
  tables: [customers, sales_orders]
  columns: [customers.customer_id, customers.name]
  tags: [sales, anti_join]
  gold_sql: |
    SELECT c.customer_id, c.name
    FROM {schema}.customers c
    WHERE NOT EXISTS (
      SELECT 1 FROM {schema}.sales_orders so
      WHERE so.customer_id = c.customer_id
    );

- id: v2_antijoin_vendors_no_po
  family: 9
  difficulty: hard
  question: "Which vendors have never received a purchase order?"
  tables: [vendors, purchase_orders]
  columns: [vendors.vendor_id, vendors.name]
  tags: [procurement, anti_join]
  gold_sql: |
    SELECT v.vendor_id, v.name
    FROM {schema}.vendors v
    WHERE NOT EXISTS (
      SELECT 1 FROM {schema}.purchase_orders po
      WHERE po.vendor_id = v.vendor_id
    );

- id: v2_antijoin_employees_no_training
  family: 9
  difficulty: hard
  question: "Which employees have not completed any training?"
  tables: [employees, employee_training]
  columns: [employees.employee_id, employees.first_name, employees.last_name]
  tags: [hr, anti_join]
  gold_sql: |
    SELECT e.employee_id, e.first_name, e.last_name
    FROM {schema}.employees e
    WHERE NOT EXISTS (
      SELECT 1 FROM {schema}.employee_training et
      WHERE et.employee_id = e.employee_id
    );

- id: v2_antijoin_products_never_sold
  family: 9
  difficulty: hard
  question: "Products that have never been sold?"
  tables: [products, order_lines]
  columns: [products.product_id, products.name]
  tags: [inventory, anti_join]
  gold_sql: |
    SELECT p.product_id, p.name, p.sku
    FROM {schema}.products p
    WHERE NOT EXISTS (
      SELECT 1 FROM {schema}.order_lines ol
      WHERE ol.product_id = p.product_id
    );

# ============================================
# Family 10: Anti-join + temporal (hard)
# ============================================

- id: v2_antijoin_temp_no_recent_txns
  family: 10
  difficulty: hard
  question: "Products with no inventory transactions in the last 90 days?"
  tables: [products, inventory_transactions]
  columns: [products.product_id, products.name]
  tags: [inventory, anti_join, temporal]
  gold_sql: |
    SELECT p.product_id, p.name
    FROM {schema}.products p
    WHERE NOT EXISTS (
      SELECT 1 FROM {schema}.inventory_transactions it
      WHERE it.product_id = p.product_id
        AND it.transaction_date >= CURRENT_DATE - INTERVAL '90 days'
    );

- id: v2_antijoin_temp_no_recent_orders
  family: 10
  difficulty: hard
  question: "Customers who have not placed any orders in {year}?"
  tables: [customers, sales_orders]
  columns: [customers.customer_id, customers.name]
  tags: [sales, anti_join, temporal]
  gold_sql: |
    SELECT c.customer_id, c.name
    FROM {schema}.customers c
    WHERE NOT EXISTS (
      SELECT 1 FROM {schema}.sales_orders so
      WHERE so.customer_id = c.customer_id
        AND EXTRACT(YEAR FROM so.order_date) = {year}
    );

- id: v2_antijoin_temp_vendors_no_recent_invoice
  family: 10
  difficulty: hard
  question: "Vendors with no invoices in the last 6 months?"
  tables: [vendors, vendor_invoices]
  columns: [vendors.vendor_id, vendors.name]
  tags: [procurement, anti_join, temporal]
  gold_sql: |
    SELECT v.vendor_id, v.name
    FROM {schema}.vendors v
    WHERE NOT EXISTS (
      SELECT 1 FROM {schema}.vendor_invoices vi
      WHERE vi.vendor_id = v.vendor_id
        AND vi.invoice_date >= CURRENT_DATE - INTERVAL '6 months'
    );

# ============================================
# Family 11: LEFT JOIN + NULL (easy)
# ============================================

- id: v2_leftjoin_employees_no_certs
  family: 11
  difficulty: easy
  question: "Employees without any certifications?"
  tables: [employees, employee_certifications]
  columns: [employees.employee_id, employees.first_name]
  tags: [hr, left_join]
  gold_sql: |
    SELECT e.employee_id, e.first_name, e.last_name
    FROM {schema}.employees e
    LEFT JOIN {schema}.employee_certifications ec ON ec.employee_id = e.employee_id
    WHERE ec.certification_id IS NULL;

- id: v2_leftjoin_products_no_supplier
  family: 11
  difficulty: easy
  question: "Products that have no assigned supplier?"
  tables: [products, product_suppliers]
  columns: [products.product_id, products.name]
  tags: [inventory, left_join]
  gold_sql: |
    SELECT p.product_id, p.name, p.sku
    FROM {schema}.products p
    LEFT JOIN {schema}.product_suppliers ps ON ps.product_id = p.product_id
    WHERE ps.supplier_id IS NULL;

- id: v2_leftjoin_depts_no_budget
  family: 11
  difficulty: easy
  question: "Departments that have no budget allocated?"
  tables: [departments, budgets]
  columns: [departments.department_id, departments.name]
  tags: [finance, left_join]
  gold_sql: |
    SELECT d.department_id, d.name
    FROM {schema}.departments d
    LEFT JOIN {schema}.budgets b ON b.department_id = d.department_id
    WHERE b.budget_id IS NULL;

# ============================================
# Family 12: Window - running total (hard)
# ============================================

- id: v2_window_running_ar
  family: 12
  difficulty: hard
  question: "Monthly AR invoice amounts with running total for {year}?"
  tables: [finance_ar_invoices]
  columns: [finance_ar_invoices.invoice_date, finance_ar_invoices.amount]
  tags: [finance, window]
  gold_sql: |
    SELECT
      DATE_TRUNC('month', invoice_date) AS month,
      SUM(amount) AS monthly_amount,
      SUM(SUM(amount)) OVER (ORDER BY DATE_TRUNC('month', invoice_date)) AS running_total
    FROM {schema}.finance_ar_invoices
    WHERE EXTRACT(YEAR FROM invoice_date) = {year}
    GROUP BY month
    ORDER BY month;

- id: v2_window_running_sales
  family: 12
  difficulty: hard
  question: "Monthly sales revenue with cumulative total for {year}?"
  tables: [order_lines, sales_orders]
  columns: [order_lines.quantity, order_lines.unit_price, sales_orders.order_date]
  tags: [sales, window]
  gold_sql: |
    SELECT
      DATE_TRUNC('month', so.order_date) AS month,
      SUM(ol.quantity * ol.unit_price) AS monthly_revenue,
      SUM(SUM(ol.quantity * ol.unit_price)) OVER (ORDER BY DATE_TRUNC('month', so.order_date)) AS cumulative_revenue
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY month
    ORDER BY month;

- id: v2_window_running_expenses
  family: 12
  difficulty: hard
  question: "Monthly project expenses with running total for {year}?"
  tables: [project_expenses]
  columns: [project_expenses.expense_date, project_expenses.amount]
  tags: [projects, window]
  gold_sql: |
    SELECT
      DATE_TRUNC('month', expense_date) AS month,
      SUM(amount) AS monthly_expense,
      SUM(SUM(amount)) OVER (ORDER BY DATE_TRUNC('month', expense_date)) AS running_total
    FROM {schema}.project_expenses
    WHERE EXTRACT(YEAR FROM expense_date) = {year}
    GROUP BY month
    ORDER BY month;

# ============================================
# Family 13: Window - RANK (hard)
# ============================================

- id: v2_window_rank_sales_reps
  family: 13
  difficulty: hard
  question: "Top 3 sales reps by revenue per department in {year}?"
  tables: [order_lines, sales_orders, employees, departments]
  columns: [order_lines.quantity, order_lines.unit_price, employees.first_name]
  tags: [sales, hr, window]
  gold_sql: |
    WITH rep_revenue AS (
      SELECT e.employee_id, e.first_name, e.last_name, d.name AS department,
             SUM(ol.quantity * ol.unit_price) AS revenue,
             RANK() OVER (PARTITION BY e.department_id ORDER BY SUM(ol.quantity * ol.unit_price) DESC) AS rnk
      FROM {schema}.order_lines ol
      JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
      JOIN {schema}.employees e ON e.employee_id = so.sales_rep_id
      JOIN {schema}.departments d ON d.department_id = e.department_id
      WHERE EXTRACT(YEAR FROM so.order_date) = {year}
      GROUP BY e.employee_id, e.first_name, e.last_name, d.name, e.department_id
    )
    SELECT first_name, last_name, department, revenue, rnk
    FROM rep_revenue
    WHERE rnk <= 3
    ORDER BY department, rnk;

- id: v2_window_rank_customers
  family: 13
  difficulty: hard
  question: "Rank customers by total order value in {year}?"
  tables: [sales_orders, order_lines, customers]
  columns: [sales_orders.order_date, order_lines.quantity, order_lines.unit_price, customers.name]
  tags: [sales, window]
  gold_sql: |
    SELECT c.name,
           SUM(ol.quantity * ol.unit_price) AS total_value,
           RANK() OVER (ORDER BY SUM(ol.quantity * ol.unit_price) DESC) AS rnk
    FROM {schema}.sales_orders so
    JOIN {schema}.order_lines ol ON ol.order_id = so.order_id
    JOIN {schema}.customers c ON c.customer_id = so.customer_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    GROUP BY c.name
    ORDER BY rnk;

# ============================================
# Family 14: Window - LAG/LEAD (extra_hard)
# ============================================

- id: v2_window_lag_headcount
  family: 14
  difficulty: extra_hard
  question: "Month-over-month headcount change for {year}?"
  tables: [employees]
  columns: [employees.hire_date, employees.termination_date]
  tags: [hr, window, temporal]
  gold_sql: |
    WITH months AS (
      SELECT generate_series(1, 12) AS month_num
    ),
    headcount AS (
      SELECT m.month_num,
             COUNT(*) AS hc
      FROM months m
      JOIN {schema}.employees e ON e.hire_date <= DATE '{year}-12-31'
        AND (DATE '{year}-01-01' + (m.month_num - 1) * INTERVAL '1 month') >= e.hire_date
        AND (e.termination_date IS NULL
             OR e.termination_date > DATE '{year}-01-01' + (m.month_num - 1) * INTERVAL '1 month')
      GROUP BY m.month_num
    )
    SELECT month_num, hc,
           hc - LAG(hc) OVER (ORDER BY month_num) AS change
    FROM headcount
    ORDER BY month_num;

- id: v2_window_lag_monthly_revenue
  family: 14
  difficulty: extra_hard
  question: "Month-over-month revenue change for {year}?"
  tables: [order_lines, sales_orders]
  columns: [order_lines.quantity, order_lines.unit_price, sales_orders.order_date]
  tags: [sales, window, temporal]
  gold_sql: |
    WITH monthly AS (
      SELECT DATE_TRUNC('month', so.order_date) AS month,
             SUM(ol.quantity * ol.unit_price) AS revenue
      FROM {schema}.order_lines ol
      JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
      WHERE EXTRACT(YEAR FROM so.order_date) = {year}
      GROUP BY month
    )
    SELECT month, revenue,
           revenue - LAG(revenue) OVER (ORDER BY month) AS change,
           ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month)) / NULLIF(LAG(revenue) OVER (ORDER BY month), 0), 2) AS pct_change
    FROM monthly
    ORDER BY month;

- id: v2_window_lag_ap_volume
  family: 14
  difficulty: extra_hard
  question: "Month-over-month AP invoice volume change for {year}?"
  tables: [finance_ap_invoices]
  columns: [finance_ap_invoices.invoice_date, finance_ap_invoices.amount]
  tags: [finance, window, temporal]
  gold_sql: |
    WITH monthly AS (
      SELECT DATE_TRUNC('month', invoice_date) AS month,
             SUM(amount) AS total_amount
      FROM {schema}.finance_ap_invoices
      WHERE EXTRACT(YEAR FROM invoice_date) = {year}
      GROUP BY month
    )
    SELECT month, total_amount,
           total_amount - LAG(total_amount) OVER (ORDER BY month) AS change
    FROM monthly
    ORDER BY month;

# ============================================
# Family 15: UNION ALL (extra_hard)
# ============================================

- id: v2_union_all_documents
  family: 15
  difficulty: extra_hard
  question: "All documents issued in January {year} — purchase orders, sales orders, and vendor invoices?"
  tables: [purchase_orders, sales_orders, vendor_invoices]
  columns: [purchase_orders.order_date, sales_orders.order_date, vendor_invoices.invoice_date]
  tags: [multi_module, union]
  gold_sql: |
    SELECT 'Purchase Order' AS doc_type, po_id AS doc_id, order_date AS doc_date, total AS amount
    FROM {schema}.purchase_orders
    WHERE order_date >= DATE '{year}-01-01' AND order_date < DATE '{year}-02-01'
    UNION ALL
    SELECT 'Sales Order', order_id, order_date, NULL
    FROM {schema}.sales_orders
    WHERE order_date >= DATE '{year}-01-01' AND order_date < DATE '{year}-02-01'
    UNION ALL
    SELECT 'Vendor Invoice', invoice_id, invoice_date, total
    FROM {schema}.vendor_invoices
    WHERE invoice_date >= DATE '{year}-01-01' AND invoice_date < DATE '{year}-02-01'
    ORDER BY doc_date;

- id: v2_union_all_financial_txns
  family: 15
  difficulty: extra_hard
  question: "All financial transactions (AR payments, AP invoices, bank transactions) for {year}?"
  tables: [finance_ar_payments, finance_ap_invoices, bank_transactions]
  columns: [finance_ar_payments.payment_date, finance_ap_invoices.invoice_date, bank_transactions.transaction_date]
  tags: [finance, union]
  gold_sql: |
    SELECT 'AR Payment' AS txn_type, payment_id AS txn_id, payment_date AS txn_date, amount
    FROM {schema}.finance_ar_payments
    WHERE EXTRACT(YEAR FROM payment_date) = {year}
    UNION ALL
    SELECT 'AP Invoice', ap_invoice_id, invoice_date, amount
    FROM {schema}.finance_ap_invoices
    WHERE EXTRACT(YEAR FROM invoice_date) = {year}
    UNION ALL
    SELECT 'Bank Transaction', transaction_id, transaction_date, amount
    FROM {schema}.bank_transactions
    WHERE EXTRACT(YEAR FROM transaction_date) = {year}
    ORDER BY txn_date;

# ============================================
# Family 16: EXCEPT (extra_hard)
# ============================================

- id: v2_except_products_not_in_year
  family: 16
  difficulty: extra_hard
  question: "Products sold in {year} but not in the prior year?"
  tables: [order_lines, sales_orders, products]
  columns: [order_lines.product_id, sales_orders.order_date]
  tags: [sales, except]
  gold_sql: |
    SELECT DISTINCT p.product_id, p.name
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    JOIN {schema}.products p ON p.product_id = ol.product_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year}
    EXCEPT
    SELECT DISTINCT p.product_id, p.name
    FROM {schema}.order_lines ol
    JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
    JOIN {schema}.products p ON p.product_id = ol.product_id
    WHERE EXTRACT(YEAR FROM so.order_date) = {year} - 1;

- id: v2_except_vendors_lost
  family: 16
  difficulty: extra_hard
  question: "Vendors who had purchase orders last year but not in {year}?"
  tables: [purchase_orders, vendors]
  columns: [purchase_orders.vendor_id, purchase_orders.order_date]
  tags: [procurement, except]
  gold_sql: |
    SELECT DISTINCT v.vendor_id, v.name
    FROM {schema}.purchase_orders po
    JOIN {schema}.vendors v ON v.vendor_id = po.vendor_id
    WHERE EXTRACT(YEAR FROM po.order_date) = {year} - 1
    EXCEPT
    SELECT DISTINCT v.vendor_id, v.name
    FROM {schema}.purchase_orders po
    JOIN {schema}.vendors v ON v.vendor_id = po.vendor_id
    WHERE EXTRACT(YEAR FROM po.order_date) = {year};

# ============================================
# Family 17: Correlated subquery (hard)
# ============================================

- id: v2_corr_salary_above_dept_avg
  family: 17
  difficulty: hard
  question: "Employees whose salary exceeds their department average?"
  tables: [employees, employee_salaries]
  columns: [employee_salaries.amount, employees.department_id]
  tags: [hr, correlated_subquery]
  gold_sql: |
    SELECT e.first_name, e.last_name, es.amount AS salary, e.department_id
    FROM {schema}.employees e
    JOIN {schema}.employee_salaries es ON es.employee_id = e.employee_id
    WHERE es.amount > (
      SELECT AVG(es2.amount)
      FROM {schema}.employee_salaries es2
      JOIN {schema}.employees e2 ON e2.employee_id = es2.employee_id
      WHERE e2.department_id = e.department_id
    );

- id: v2_corr_projects_above_avg_budget
  family: 17
  difficulty: hard
  question: "Projects with total expenses exceeding the average project budget?"
  tables: [projects, project_expenses, project_budgets]
  columns: [project_expenses.amount, project_budgets.planned_amount]
  tags: [projects, correlated_subquery]
  gold_sql: |
    SELECT p.project_id, p.name, SUM(pe.amount) AS total_expenses
    FROM {schema}.projects p
    JOIN {schema}.project_expenses pe ON pe.project_id = p.project_id
    GROUP BY p.project_id, p.name
    HAVING SUM(pe.amount) > (
      SELECT AVG(pb.planned_amount)
      FROM {schema}.project_budgets pb
    );

# ============================================
# Family 18: Self-join hierarchy (extra_hard)
# ============================================

- id: v2_selfjoin_dept_parent
  family: 18
  difficulty: extra_hard
  question: "List all departments with their parent department names."
  tables: [departments]
  columns: [departments.department_id, departments.name, departments.parent_department_id]
  tags: [hr, self_join, hierarchy]
  gold_sql: |
    SELECT d.name AS department, pd.name AS parent_department
    FROM {schema}.departments d
    LEFT JOIN {schema}.departments pd ON pd.department_id = d.parent_department_id
    ORDER BY d.name;

- id: v2_selfjoin_bu_hierarchy
  family: 18
  difficulty: extra_hard
  question: "Business units and their parent unit names?"
  tables: [business_units]
  columns: [business_units.unit_id, business_units.name, business_units.parent_unit_id]
  tags: [admin, self_join, hierarchy]
  gold_sql: |
    SELECT bu.name AS unit, pbu.name AS parent_unit
    FROM {schema}.business_units bu
    LEFT JOIN {schema}.business_units pbu ON pbu.unit_id = bu.parent_unit_id
    ORDER BY bu.name;

- id: v2_selfjoin_dept_children_count
  family: 18
  difficulty: extra_hard
  question: "How many sub-departments does each department have?"
  tables: [departments]
  columns: [departments.department_id, departments.name, departments.parent_department_id]
  tags: [hr, self_join, hierarchy]
  gold_sql: |
    SELECT p.name AS department, COUNT(c.department_id) AS sub_department_count
    FROM {schema}.departments p
    LEFT JOIN {schema}.departments c ON c.parent_department_id = p.department_id
    GROUP BY p.name
    ORDER BY sub_department_count DESC;

# ============================================
# Family 19: Multi-CTE business logic (hard)
# ============================================

- id: v2_cte_vendor_delivery_perf
  family: 19
  difficulty: hard
  question: "Vendor delivery performance: on-time vs late for {year}?"
  tables: [purchase_orders, goods_receipts, vendors]
  columns: [purchase_orders.order_date, goods_receipts.receipt_date, vendors.name]
  tags: [procurement, cte]
  gold_sql: |
    WITH delivery AS (
      SELECT v.name AS vendor,
             CASE WHEN gr.receipt_date <= po.order_date + 14 THEN 'on_time' ELSE 'late' END AS status
      FROM {schema}.purchase_orders po
      JOIN {schema}.goods_receipts gr ON gr.po_id = po.po_id
      JOIN {schema}.vendors v ON v.vendor_id = po.vendor_id
      WHERE EXTRACT(YEAR FROM po.order_date) = {year}
    )
    SELECT vendor,
           COUNT(*) FILTER (WHERE status = 'on_time') AS on_time,
           COUNT(*) FILTER (WHERE status = 'late') AS late,
           ROUND(100.0 * COUNT(*) FILTER (WHERE status = 'on_time') / COUNT(*), 2) AS on_time_pct
    FROM delivery
    GROUP BY vendor
    ORDER BY on_time_pct DESC;

- id: v2_cte_employee_turnover
  family: 19
  difficulty: hard
  question: "Employee turnover rate for {year}?"
  tables: [employees]
  columns: [employees.termination_date, employees.hire_date]
  tags: [hr, cte]
  gold_sql: |
    WITH terminations AS (
      SELECT COUNT(*) AS term_count
      FROM {schema}.employees
      WHERE EXTRACT(YEAR FROM termination_date) = {year}
    ),
    headcount AS (
      SELECT COUNT(*) AS headcount
      FROM {schema}.employees
      WHERE hire_date <= DATE '{year}-12-31'
        AND (termination_date IS NULL OR termination_date > DATE '{year}-01-01')
    )
    SELECT ROUND(100.0 * t.term_count / NULLIF(h.headcount,0), 2) AS turnover_pct
    FROM terminations t, headcount h;

- id: v2_cte_working_capital
  family: 19
  difficulty: hard
  question: "Working capital ratio (AR vs AP) for {year}?"
  tables: [finance_ar_invoices, finance_ap_invoices]
  columns: [finance_ar_invoices.amount, finance_ap_invoices.amount]
  tags: [finance, cte]
  gold_sql: |
    WITH ar AS (
      SELECT SUM(amount) AS total_ar
      FROM {schema}.finance_ar_invoices
      WHERE status = 'open' AND EXTRACT(YEAR FROM invoice_date) = {year}
    ),
    ap AS (
      SELECT SUM(amount) AS total_ap
      FROM {schema}.finance_ap_invoices
      WHERE status = 'open' AND EXTRACT(YEAR FROM invoice_date) = {year}
    )
    SELECT ar.total_ar, ap.total_ap,
           ROUND(ar.total_ar / NULLIF(ap.total_ap, 0), 2) AS working_capital_ratio
    FROM ar, ap;

- id: v2_cte_revenue_per_fte
  family: 19
  difficulty: hard
  question: "Revenue per full-time employee by department for {year}?"
  tables: [order_lines, sales_orders, employees, departments]
  columns: [order_lines.quantity, order_lines.unit_price, employees.department_id]
  tags: [sales, hr, cte]
  gold_sql: |
    WITH dept_revenue AS (
      SELECT e.department_id,
             SUM(ol.quantity * ol.unit_price) AS revenue
      FROM {schema}.order_lines ol
      JOIN {schema}.sales_orders so ON so.order_id = ol.order_id
      JOIN {schema}.employees e ON e.employee_id = so.sales_rep_id
      WHERE EXTRACT(YEAR FROM so.order_date) = {year}
      GROUP BY e.department_id
    ),
    dept_fte AS (
      SELECT department_id, COUNT(*) AS fte
      FROM {schema}.employees
      WHERE hire_date <= DATE '{year}-12-31'
        AND (termination_date IS NULL OR termination_date > DATE '{year}-01-01')
      GROUP BY department_id
    )
    SELECT d.name,
           dr.revenue,
           df.fte,
           ROUND(dr.revenue / NULLIF(df.fte, 0), 2) AS revenue_per_fte
    FROM dept_revenue dr
    JOIN dept_fte df ON df.department_id = dr.department_id
    JOIN {schema}.departments d ON d.department_id = dr.department_id
    ORDER BY revenue_per_fte DESC;

# ============================================
# Family 20: Composite key JOIN (extra_hard)
# ============================================

- id: v2_composite_inventory_reorder
  family: 20
  difficulty: extra_hard
  question: "Inventory levels with reorder status by warehouse and product?"
  tables: [inventory_levels, reorder_rules, products, warehouses]
  columns: [inventory_levels.quantity_on_hand, reorder_rules.min_quantity]
  tags: [inventory, composite_key]
  gold_sql: |
    SELECT w.name AS warehouse, p.name AS product,
           il.quantity_on_hand, rr.min_quantity,
           CASE WHEN il.quantity_on_hand < rr.min_quantity THEN 'REORDER' ELSE 'OK' END AS status
    FROM {schema}.inventory_levels il
    JOIN {schema}.reorder_rules rr ON rr.product_id = il.product_id AND rr.warehouse_id = il.warehouse_id
    JOIN {schema}.products p ON p.product_id = il.product_id
    JOIN {schema}.warehouses w ON w.warehouse_id = il.warehouse_id
    WHERE il.quantity_on_hand < rr.min_quantity;

- id: v2_composite_depreciation_by_period
  family: 20
  difficulty: extra_hard
  question: "Total depreciation by fiscal period for {year}?"
  tables: [depreciation_entries, fiscal_periods]
  columns: [depreciation_entries.amount, fiscal_periods.start_date]
  tags: [assets, finance, composite_key]
  gold_sql: |
    SELECT fp.start_date, fp.end_date, SUM(de.amount) AS total_depreciation
    FROM {schema}.depreciation_entries de
    JOIN {schema}.fiscal_periods fp ON fp.period_id = de.period_id
    WHERE EXTRACT(YEAR FROM fp.start_date) = {year}
    GROUP BY fp.start_date, fp.end_date
    ORDER BY fp.start_date;

# ============================================
# Family 21: View-like query (extra_hard)
# ============================================

- id: v2_viewlike_active_employees
  family: 21
  difficulty: extra_hard
  question: "Show the current active employee roster with department and position."
  tables: [employees, departments, positions]
  columns: [employees.first_name, employees.last_name, departments.name, positions.title]
  tags: [hr, view_query]
  gold_sql: |
    SELECT e.first_name, e.last_name, d.name AS department, p.title AS position
    FROM {schema}.employees e
    JOIN {schema}.departments d ON d.department_id = e.department_id
    LEFT JOIN {schema}.positions p ON p.position_id = e.position_id
    WHERE e.termination_date IS NULL
    ORDER BY d.name, e.last_name;

- id: v2_viewlike_open_ar_aging
  family: 21
  difficulty: extra_hard
  question: "Show the open AR aging summary with customer names."
  tables: [finance_ar_invoices, customers]
  columns: [finance_ar_invoices.due_date, finance_ar_invoices.amount, customers.name]
  tags: [finance, view_query]
  gold_sql: |
    SELECT c.name AS customer,
      CASE
        WHEN CURRENT_DATE - i.due_date <= 30 THEN '0-30'
        WHEN CURRENT_DATE - i.due_date <= 60 THEN '31-60'
        WHEN CURRENT_DATE - i.due_date <= 90 THEN '61-90'
        ELSE '90+'
      END AS aging_bucket,
      SUM(i.amount) AS total_amount
    FROM {schema}.finance_ar_invoices i
    JOIN {schema}.customers c ON c.customer_id = i.customer_id
    WHERE i.status = 'open'
    GROUP BY c.name, aging_bucket
    ORDER BY c.name, aging_bucket;

