- id: v2_implicit_val_open_ar
  family: 23
  difficulty: medium
  question: "How many unpaid AR invoices are over {amount}?"
  tables: [finance_ar_invoices]
  columns: [finance_ar_invoices.amount, finance_ar_invoices.status]
