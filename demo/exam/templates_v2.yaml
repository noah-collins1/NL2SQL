      AND amount > {amount};

- id: v2_implicit_val_late_pct
  family: 23
  difficulty: medium
  question: "What percentage of AR invoices were late in {year}?"
  tables: [finance_ar_invoices]
  columns: [finance_ar_invoices.status, finance_ar_invoices.invoice_date]
