- id: v2_implicit_val_overdue_vi
  family: 23
  difficulty: medium
  question: "Show all overdue vendor invoices."
  tables: [vendor_invoices]
  columns: [vendor_invoices.due_date, vendor_invoices.total, vendor_invoices.status]
