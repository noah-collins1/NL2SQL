- id: trx_antijoin_items_no_po
  family: 18
  difficulty: hard
  question: "Which stock items have never been purchased on a purchase order?"
  tables: [tbl_item, tbl_purchase_order_line]
  columns: [tbl_item.Item, tbl_item.Type, tbl_purchase_order_line.Item]
  tags: [inventory, anti_join]
  gold_sql: |
    SELECT i."Item", i."Description", i."StockUOM", i."StandardCost"
    FROM "tbl_item" i
    WHERE i."Type" = 'STOCK'
      AND NOT EXISTS (
        SELECT 1 FROM "tbl_purchase_order_line" l WHERE l."Item" = i."Item"
      )
    ORDER BY i."Item";

- id: trx_antijoin_customers_no_invoice
  family: 18
  difficulty: hard
  question: "Which customers have never had an invoice?"
  tables: [tbl_customer, tbl_invoice]
