- id: trx_join_invoice_customer_year
  family: 16
  difficulty: medium
  question: "What was the total invoiced amount per customer in {year}?"
  tables: [tbl_invoice, tbl_customer]
  columns: [tbl_invoice.Customer, tbl_invoice.InvoiceAmount, tbl_invoice.InvoiceDate, tbl_customer.Name]
  tags: [accounts_receivable, customers, join, temporal]
  gold_sql: |
    SELECT c."Name" AS customer_name,
           COUNT(i."InvoiceNumber") AS invoice_count,
           SUM(i."InvoiceAmount") AS total_invoiced,
           SUM(COALESCE(i."PaidAmount", 0)) AS total_paid
    FROM "tbl_invoice" i
    JOIN "tbl_customer" c ON c."Customer" = i."Customer"
    WHERE EXTRACT(YEAR FROM i."InvoiceDate") = {year}
    GROUP BY c."Name"
    ORDER BY total_invoiced DESC;

- id: trx_join_po_vendor_year
  family: 16
  difficulty: medium
  question: "What was the total PO value placed with each vendor in {year}?"
  tables: [tbl_purchase_order, tbl_purchase_order_line, tbl_vendor]
  columns: [tbl_purchase_order.VendorPurchaseFrom, tbl_purchase_order.OrderDate, tbl_purchase_order_line.UnitCost, tbl_purchase_order_line.Quantity, tbl_vendor.Name]
  tags: [purchasing, vendors, join, temporal]
  gold_sql: |
    SELECT v."Name" AS vendor_name,
           COUNT(DISTINCT p."PONumber") AS po_count,
           SUM(NULLIF(l."Quantity", '')::numeric * l."UnitCost") AS total_po_value
    FROM "tbl_purchase_order" p
    JOIN "tbl_purchase_order_line" l ON l."PONumber" = p."PONumber"
    JOIN "tbl_vendor" v ON v."Vendor" = p."VendorPurchaseFrom"
    WHERE EXTRACT(YEAR FROM p."OrderDate") = {year}
    GROUP BY v."Name"
    ORDER BY total_po_value DESC NULLS LAST;

- id: trx_join_wopi_item_inassy
  family: 16
  difficulty: medium
  question: "Which items are currently used in in-assembly work orders?"
  tables: [tbl_work_order, tbl_work_order_item, tbl_item]
  columns: [tbl_work_order.AssemblyStatus, tbl_work_order_item.Item, tbl_item.Description]
  tags: [warehouse, inventory, join]
  gold_sql: |
    SELECT DISTINCT wi."Item", im."Description",
           COUNT(DISTINCT wi."WorkOrderNumber") AS wo_count
    FROM "tbl_work_order" w
    JOIN "tbl_work_order_item" wi ON wi."WorkOrderNumber" = w."WorkOrderNumber"
    JOIN "tbl_item" im ON im."Item" = wi."Item"
    WHERE w."AssemblyStatus" = 'INASSY'
      AND wi."Item" IS NOT NULL AND wi."Item" != ''
    GROUP BY wi."Item", im."Description"
    ORDER BY wo_count DESC;

- id: trx_join_voucher_vendor_year
  family: 16
  difficulty: medium
  question: "What was the total AP voucher amount by vendor in {year}?"
  tables: [tbl_voucher, tbl_vendor]
  columns: [tbl_voucher.Vendor, tbl_voucher.InvoiceAmount, tbl_voucher.PaymentTermsDueDate, tbl_vendor.Name]
  tags: [accounts_payable, vendors, join, temporal]
  gold_sql: |
    SELECT vn."Name" AS vendor_name,
           COUNT(v."VoucherNumber") AS voucher_count,
           SUM(v."InvoiceAmount") AS total_amount
    FROM "tbl_voucher" v
    JOIN "tbl_vendor" vn ON vn."Vendor" = v."Vendor"
    WHERE EXTRACT(YEAR FROM v."PaymentTermsDueDate") = {year}
    GROUP BY vn."Name"
    ORDER BY total_amount DESC;

- id: trx_join_gl_account_type_year
  family: 16
  difficulty: medium
  question: "What is the net GL balance by account type in {year}?"
  tables: [tbl_je_line_item, tbl_gl_account]
  columns: [tbl_je_line_item.AccountNumber, tbl_je_line_item.DebitAmount, tbl_je_line_item.CreditAmount, tbl_je_line_item.TransactionDate, tbl_gl_account.AccountType]
  tags: [general_ledger, join, temporal]
  gold_sql: |
    SELECT a."AccountType",
           SUM(je."DebitAmount") AS total_debits,
           SUM(je."CreditAmount") AS total_credits,
           SUM(je."DebitAmount") - SUM(je."CreditAmount") AS net_balance
    FROM "tbl_je_line_item" je
    JOIN "tbl_gl_account" a ON a."AccountId" = je."AccountNumber"
    WHERE EXTRACT(YEAR FROM je."TransactionDate") = {year}
    GROUP BY a."AccountType"
    ORDER BY net_balance DESC;

