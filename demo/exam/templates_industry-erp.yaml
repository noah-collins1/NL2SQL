  columns: [tbl_purchase_order.VendorPurchaseFrom, tbl_vendor.Name]
  tags: [purchasing, vendors, having]
  gold_sql: |
    SELECT v."Name" AS vendor_name, COUNT(p."PONumber") AS po_count
    FROM "tbl_purchase_order" p
    JOIN "tbl_vendor" v ON v."Vendor" = p."VendorPurchaseFrom"
    GROUP BY v."Name"
    HAVING COUNT(p."PONumber") >= {n}
    ORDER BY po_count DESC;

- id: trx_having_reps_min_commission
  family: 19
  difficulty: medium
  question: "Which sales reps have more than {n} commission lines reported?"
  tables: [tbl_tiered_commission, tbl_sales_rep]
  columns: [tbl_tiered_commission.SalesRep, tbl_sales_rep.Name]
  tags: [commissions, having]
  gold_sql: |
    SELECT r."Name" AS rep_name, COUNT(c."InvoiceNumber") AS commission_lines
    FROM "tbl_tiered_commission" c
    JOIN "tbl_sales_rep" r ON r."SalesRep" = c."SalesRep"
    GROUP BY r."Name"
    HAVING COUNT(c."InvoiceNumber") > {n}
    ORDER BY commission_lines DESC;

- id: trx_having_gl_accounts_min_entries
  family: 19
  difficulty: medium
  question: "Which GL accounts have more than {n} journal entries?"
  tables: [tbl_je_line_item, tbl_gl_account]
  columns: [tbl_je_line_item.AccountNumber, tbl_gl_account.Description]
  tags: [general_ledger, having]
  gold_sql: |
    SELECT je."AccountNumber", a."Description", a."AccountType",
           COUNT(*) AS entry_count
    FROM "tbl_je_line_item" je
    JOIN "tbl_gl_account" a ON a."AccountId" = je."AccountNumber"
    GROUP BY je."AccountNumber", a."Description", a."AccountType"
    HAVING COUNT(*) > {n}
    ORDER BY entry_count DESC;

# ============================================================
# Family 20: More window functions (hard) — some with {year}
# ============================================================

- id: trx_window_invoice_running_year
  family: 20
  difficulty: hard
  question: "Show cumulative invoiced amount by month in {year}."
  tables: [tbl_invoice]
  columns: [tbl_invoice.InvoiceDate, tbl_invoice.InvoiceAmount]
  tags: [accounts_receivable, window_function, temporal]
  gold_sql: |
    SELECT DATE_TRUNC('month', "InvoiceDate") AS month,
           SUM("InvoiceAmount") AS monthly_amount,
           SUM(SUM("InvoiceAmount")) OVER (ORDER BY DATE_TRUNC('month', "InvoiceDate")) AS running_total
    FROM "tbl_invoice"
    WHERE EXTRACT(YEAR FROM "InvoiceDate") = {year}
    GROUP BY month
    ORDER BY month;

- id: trx_window_rank_items_cost
  family: 20
  difficulty: hard
  question: "Rank all stock items by standard cost."
  tables: [tbl_item]
  columns: [tbl_item.StandardCost, tbl_item.Type]
  tags: [inventory, window_function]
  gold_sql: |
    SELECT "Item", "Description", "StandardCost",
           RANK() OVER (ORDER BY "StandardCost" DESC) AS cost_rank
    FROM "tbl_item"
    WHERE "Type" = 'STOCK' AND "StandardCost" > 0
    ORDER BY cost_rank;

- id: trx_window_rank_vendors_ap
  family: 20
  difficulty: hard
  question: "Rank all vendors by AP balance."
  tables: [tbl_vendor]
  columns: [tbl_vendor.APBalance, tbl_vendor.Name]
  tags: [vendors, accounts_payable, window_function]
  gold_sql: |
    SELECT "Vendor", "Name", "APBalance",
           RANK() OVER (ORDER BY "APBalance" DESC NULLS LAST) AS ap_rank
    FROM "tbl_vendor"
    WHERE "APBalance" IS NOT NULL
    ORDER BY ap_rank;

- id: trx_window_po_running_year
  family: 20
  difficulty: hard
  question: "Show monthly PO count with running total in {year}."
  tables: [tbl_purchase_order]
  columns: [tbl_purchase_order.OrderDate]
  tags: [purchasing, window_function, temporal]
  gold_sql: |
    SELECT DATE_TRUNC('month', "OrderDate") AS month,
           COUNT(*) AS monthly_count,
           SUM(COUNT(*)) OVER (ORDER BY DATE_TRUNC('month', "OrderDate")) AS running_total
    FROM "tbl_purchase_order"
    WHERE EXTRACT(YEAR FROM "OrderDate") = {year}
    GROUP BY month
    ORDER BY month;

- id: trx_window_so_pct_of_year
  family: 20
  difficulty: hard
  question: "What percentage of annual sales order volume does each month represent in {year}?"
  tables: [tbl_sales_order]
  columns: [tbl_sales_order.DateOrdered]
  tags: [sales_orders, window_function, temporal]
  gold_sql: |
    SELECT DATE_TRUNC('month', "DateOrdered") AS month,
           COUNT(*) AS monthly_count,
           ROUND(
             100.0 * COUNT(*) / SUM(COUNT(*)) OVER (),
             2
           ) AS pct_of_year
    FROM "tbl_sales_order"
    WHERE EXTRACT(YEAR FROM "DateOrdered") = {year}
    GROUP BY month
    ORDER BY month;

- id: trx_window_rank_customers_so
  family: 20
  difficulty: hard
  question: "Rank customers by total number of sales orders."
  tables: [tbl_sales_order, tbl_customer]
  columns: [tbl_sales_order.CustomerShipTo, tbl_customer.Name]
  tags: [sales_orders, customers, window_function]
  gold_sql: |
    SELECT c."Name" AS customer_name,
           COUNT(s."SONumber") AS so_count,
           RANK() OVER (ORDER BY COUNT(s."SONumber") DESC) AS rnk
    FROM "tbl_sales_order" s
    JOIN "tbl_customer" c ON c."Customer" = s."CustomerShipTo"
    GROUP BY c."Name"
    ORDER BY rnk;

# ============================================================
# Family 21: Date arithmetic (hard) — some with {year}
# ============================================================

- id: trx_datemath_so_to_required
  family: 21
  difficulty: hard
  question: "What is the average days between order date and required date for sales orders in {year}?"
  tables: [tbl_sales_order]
  columns: [tbl_sales_order.DateOrdered, tbl_sales_order.DateRequired]
  tags: [sales_orders, temporal]
  gold_sql: |
    SELECT ROUND(AVG(("DateRequired"::date - "DateOrdered"::date)), 1) AS avg_days_to_required
    FROM "tbl_sales_order"
    WHERE EXTRACT(YEAR FROM "DateOrdered") = {year}
      AND "DateRequired" IS NOT NULL
      AND "DateRequired" > "DateOrdered";

- id: trx_datemath_invoice_overdue
  family: 21
  difficulty: hard
  question: "How many days overdue is each open invoice as of today?"
  tables: [tbl_invoice, tbl_customer]
  columns: [tbl_invoice.Status, tbl_invoice.InvoiceDueDate, tbl_customer.Name]
  tags: [accounts_receivable, temporal]
  gold_sql: |
    SELECT i."InvoiceNumber", c."Name" AS customer_name,
           i."InvoiceAmount",
           i."InvoiceDueDate"::date AS due_date,
           CURRENT_DATE - i."InvoiceDueDate"::date AS days_overdue
    FROM "tbl_invoice" i
    JOIN "tbl_customer" c ON c."Customer" = i."Customer"
    WHERE i."Status" = 'OPEN'
      AND i."InvoiceDueDate" IS NOT NULL
      AND i."InvoiceDueDate"::date < CURRENT_DATE
    ORDER BY days_overdue DESC;

- id: trx_datemath_po_lead_time
  family: 21
  difficulty: hard
  question: "What is the average lead time in days from PO order date to required date in {year}?"
  tables: [tbl_purchase_order]
  columns: [tbl_purchase_order.OrderDate, tbl_purchase_order.RequiredDate]
  tags: [purchasing, temporal]
  gold_sql: |
    SELECT "OrderingLocation",
           ROUND(AVG(("RequiredDate"::date - "OrderDate"::date)), 1) AS avg_lead_days,
           COUNT(*) AS po_count
    FROM "tbl_purchase_order"
    WHERE EXTRACT(YEAR FROM "OrderDate") = {year}
      AND "RequiredDate" IS NOT NULL
      AND "RequiredDate" > "OrderDate"
    GROUP BY "OrderingLocation"
    ORDER BY avg_lead_days DESC;

- id: trx_datemath_so_past_required
  family: 21
  difficulty: hard
  question: "Which open sales order lines have a required date that has already passed?"
  tables: [tbl_sales_order, tbl_so_line]
  columns: [tbl_so_line.DateRequired, tbl_sales_order.Status]
  tags: [sales_orders, temporal]
  gold_sql: |
    SELECT s."SONumber", s."CustomerShipTo",
           l."SOLineNumber", l."Item", l."Description",
           l."DateRequired"::date AS required_date,
           CURRENT_DATE - l."DateRequired"::date AS days_late
    FROM "tbl_sales_order" s
    JOIN "tbl_so_line" l ON l."SONumber" = s."SONumber"
    WHERE s."Status" = 'OPEN'
      AND l."DateRequired" IS NOT NULL
      AND l."DateRequired"::date < CURRENT_DATE
    ORDER BY days_late DESC
    LIMIT 50;

# ============================================================
# Family 22: CTE patterns (hard) — some with {year}
# ============================================================

- id: trx_cte_ar_aging
  family: 22
  difficulty: hard
  question: "Show AR aging summary by bucket: current, 1-30 days, 31-60 days, 61-90 days, over 90 days."
  tables: [tbl_invoice]
  columns: [tbl_invoice.Status, tbl_invoice.InvoiceDueDate, tbl_invoice.InvoiceAmount]
  tags: [accounts_receivable, cte]
  gold_sql: |
    WITH aged AS (
      SELECT "InvoiceNumber", "Customer", "InvoiceAmount",
             CURRENT_DATE - "InvoiceDueDate"::date AS days_overdue
      FROM "tbl_invoice"
      WHERE "Status" = 'OPEN'
        AND "InvoiceDueDate" IS NOT NULL
    )
    SELECT
      SUM(CASE WHEN days_overdue <= 0 THEN "InvoiceAmount" ELSE 0 END) AS current_amount,
      SUM(CASE WHEN days_overdue BETWEEN 1 AND 30 THEN "InvoiceAmount" ELSE 0 END) AS days_1_30,
      SUM(CASE WHEN days_overdue BETWEEN 31 AND 60 THEN "InvoiceAmount" ELSE 0 END) AS days_31_60,
      SUM(CASE WHEN days_overdue BETWEEN 61 AND 90 THEN "InvoiceAmount" ELSE 0 END) AS days_61_90,
      SUM(CASE WHEN days_overdue > 90 THEN "InvoiceAmount" ELSE 0 END) AS over_90
    FROM aged;

- id: trx_cte_invoice_paid_pct
  family: 22
  difficulty: hard
  question: "What percentage of total invoiced amount has been paid per customer?"
  tables: [tbl_invoice, tbl_customer]
  columns: [tbl_invoice.Customer, tbl_invoice.InvoiceAmount, tbl_invoice.PaidAmount, tbl_customer.Name]
  tags: [accounts_receivable, customers, cte]
  gold_sql: |
    WITH totals AS (
      SELECT i."Customer",
             SUM(i."InvoiceAmount") AS total_invoiced,
             SUM(COALESCE(i."PaidAmount", 0)) AS total_paid
      FROM "tbl_invoice" i
      GROUP BY i."Customer"
    )
    SELECT c."Name" AS customer_name,
           t.total_invoiced,
           t.total_paid,
           ROUND(100.0 * t.total_paid / NULLIF(t.total_invoiced, 0), 2) AS pct_paid
    FROM totals t
    JOIN "tbl_customer" c ON c."Customer" = t."Customer"
    ORDER BY pct_paid ASC NULLS LAST;

- id: trx_cte_so_fulfillment_year
  family: 22
  difficulty: hard
  question: "What is the average SO line fulfillment rate (shipped/ordered) by customer in {year}?"
  tables: [tbl_sales_order, tbl_so_line, tbl_customer]
  columns: [tbl_sales_order.DateOrdered, tbl_so_line.Quantity, tbl_so_line.QuantityShipped, tbl_sales_order.CustomerShipTo, tbl_customer.Name]
  tags: [sales_orders, customers, cte, temporal]
  gold_sql: |
    WITH line_rates AS (
      SELECT s."CustomerShipTo",
             NULLIF(l."Quantity", '')::numeric AS qty_ordered,
             NULLIF(l."QuantityShipped", '')::numeric AS qty_shipped
      FROM "tbl_sales_order" s
      JOIN "tbl_so_line" l ON l."SONumber" = s."SONumber"
      WHERE EXTRACT(YEAR FROM s."DateOrdered") = {year}
        AND NULLIF(l."Quantity", '')::numeric > 0
    )
    SELECT c."Name" AS customer_name,
           COUNT(*) AS line_count,
           ROUND(
             100.0 * SUM(COALESCE(lr.qty_shipped, 0)) /
             NULLIF(SUM(lr.qty_ordered), 0),
             1
           ) AS fulfillment_pct
    FROM line_rates lr
    JOIN "tbl_customer" c ON c."Customer" = lr."CustomerShipTo"
    GROUP BY c."Name"
    ORDER BY fulfillment_pct ASC NULLS LAST;

- id: trx_cte_wip_cost_summary
  family: 22
  difficulty: hard
  question: "Summarize work order costs: total estimated, total completed, and variance by assembly status."
  tables: [tbl_work_order, tbl_work_order_item]
  columns: [tbl_work_order.AssemblyStatus, tbl_work_order_item.EstimatedExtendedCost, tbl_work_order_item.ExtendedCostCompleted]
  tags: [warehouse, cte]
  gold_sql: |
    WITH wo_costs AS (
      SELECT w."AssemblyStatus",
             SUM(wi."EstimatedExtendedCost") AS total_estimated,
             SUM(wi."ExtendedCostCompleted") AS total_completed
      FROM "tbl_work_order" w
      JOIN "tbl_work_order_item" wi ON wi."WorkOrderNumber" = w."WorkOrderNumber"
      GROUP BY w."AssemblyStatus"
    )
    SELECT "AssemblyStatus",
           total_estimated,
           total_completed,
           total_estimated - COALESCE(total_completed, 0) AS variance
    FROM wo_costs
    ORDER BY total_estimated DESC NULLS LAST;

# ============================================================
# Family 23: UNION / multi-source (hard)
# ============================================================

- id: trx_union_open_transactions
  family: 23
  difficulty: hard
  question: "List all open transactions across sales orders and purchase orders."
  tables: [tbl_sales_order, tbl_purchase_order]
  columns: [tbl_sales_order.Status, tbl_purchase_order.Status]
  tags: [sales_orders, purchasing, union]
  gold_sql: |
    SELECT 'SO' AS txn_type, "SONumber" AS txn_number,
           "CustomerShipTo" AS counterparty, "DateOrdered" AS txn_date
    FROM "tbl_sales_order"
    WHERE "Status" = 'OPEN'
    UNION ALL
    SELECT 'PO' AS txn_type, "PONumber" AS txn_number,
           "VendorPurchaseFrom" AS counterparty, "OrderDate" AS txn_date
    FROM "tbl_purchase_order"
    WHERE "Status" = 'OPEN'
    ORDER BY txn_date DESC;

- id: trx_union_ar_ap_balances
  family: 23
  difficulty: hard
  question: "Show combined AR and AP open balances by trading partner."
  tables: [tbl_customer, tbl_vendor]
  columns: [tbl_customer.ARBalance, tbl_vendor.APBalance]
  tags: [accounts_receivable, accounts_payable, union]
  gold_sql: |
    SELECT 'CUSTOMER' AS type, "Customer" AS code, "Name",
           "ARBalance" AS balance
    FROM "tbl_customer"
    WHERE "ARBalance" IS NOT NULL AND "ARBalance" > 0
    UNION ALL
    SELECT 'VENDOR' AS type, "Vendor" AS code, "Name",
           "APBalance" AS balance
    FROM "tbl_vendor"
    WHERE "APBalance" IS NOT NULL AND "APBalance" > 0
    ORDER BY balance DESC;

- id: trx_union_so_invoice_customer_year
  family: 23
  difficulty: hard
  question: "Show all SO and invoice activity for customers in {year}."
  tables: [tbl_sales_order, tbl_invoice, tbl_customer]
  columns: [tbl_sales_order.CustomerShipTo, tbl_sales_order.DateOrdered, tbl_invoice.Customer, tbl_invoice.InvoiceDate]
  tags: [sales_orders, accounts_receivable, union, temporal]
  gold_sql: |
    SELECT 'SO' AS activity_type,
           s."SONumber" AS reference,
           c."Name" AS customer_name,
           s."DateOrdered"::date AS activity_date
    FROM "tbl_sales_order" s
    JOIN "tbl_customer" c ON c."Customer" = s."CustomerShipTo"
    WHERE EXTRACT(YEAR FROM s."DateOrdered") = {year}
    UNION ALL
    SELECT 'INVOICE' AS activity_type,
           i."InvoiceNumber" AS reference,
           c."Name" AS customer_name,
           i."InvoiceDate"::date AS activity_date
    FROM "tbl_invoice" i
    JOIN "tbl_customer" c ON c."Customer" = i."Customer"
    WHERE EXTRACT(YEAR FROM i."InvoiceDate") = {year}
    ORDER BY customer_name, activity_date;

# ============================================================
# Family 24: EXCEPT / set difference (hard)
# ============================================================

- id: trx_except_items_so_not_po_year
  family: 24
  difficulty: hard
  question: "Which items were sold in {year} but never purchased in {year}?"
  tables: [tbl_so_line, tbl_sales_order, tbl_purchase_order_line, tbl_purchase_order]
  columns: [tbl_so_line.Item, tbl_sales_order.DateOrdered, tbl_purchase_order_line.Item, tbl_purchase_order.OrderDate]
  tags: [inventory, except, temporal]
  gold_sql: |
    SELECT sl."Item"
    FROM "tbl_so_line" sl
    JOIN "tbl_sales_order" s ON s."SONumber" = sl."SONumber"
    WHERE EXTRACT(YEAR FROM s."DateOrdered") = {year}
      AND sl."Item" IS NOT NULL AND sl."Item" != ''
    EXCEPT
    SELECT pl."Item"
    FROM "tbl_purchase_order_line" pl
    JOIN "tbl_purchase_order" p ON p."PONumber" = pl."PONumber"
    WHERE EXTRACT(YEAR FROM p."OrderDate") = {year}
      AND pl."Item" IS NOT NULL AND pl."Item" != ''
    ORDER BY "Item";

- id: trx_except_customers_so_not_invoiced_year
  family: 24
  difficulty: hard
  question: "Which customers placed sales orders in {year} but received no invoices in {year}?"
  tables: [tbl_sales_order, tbl_invoice]
  columns: [tbl_sales_order.CustomerShipTo, tbl_sales_order.DateOrdered, tbl_invoice.Customer, tbl_invoice.InvoiceDate]
  tags: [customers, except, temporal]
  gold_sql: |
    SELECT "CustomerShipTo" AS customer_code
    FROM "tbl_sales_order"
    WHERE EXTRACT(YEAR FROM "DateOrdered") = {year}
    EXCEPT
    SELECT "Customer" AS customer_code
    FROM "tbl_invoice"
    WHERE EXTRACT(YEAR FROM "InvoiceDate") = {year}
    ORDER BY customer_code;

- id: trx_except_vendors_po_not_voucher_year
  family: 24
  difficulty: hard
  question: "Which vendors had purchase orders in {year} but no AP vouchers in {year}?"
  tables: [tbl_purchase_order, tbl_voucher]
  columns: [tbl_purchase_order.VendorPurchaseFrom, tbl_purchase_order.OrderDate, tbl_voucher.Vendor, tbl_voucher.PaymentTermsDueDate]
  tags: [vendors, except, temporal]
  gold_sql: |
    SELECT "VendorPurchaseFrom" AS vendor_code
    FROM "tbl_purchase_order"
    WHERE EXTRACT(YEAR FROM "OrderDate") = {year}
    EXCEPT
    SELECT "Vendor" AS vendor_code
    FROM "tbl_voucher"
    WHERE EXTRACT(YEAR FROM "PaymentTermsDueDate") = {year}
    ORDER BY vendor_code;

# ============================================================
# Family 25: Location-based queries (medium) — param: {location}
# ============================================================

- id: trx_loc_inventory_value
  family: 25
  difficulty: medium
  question: "What is the total inventory value at location {location}?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item_location.Location, tbl_item_location.QuantityOnHand, tbl_item.StandardCost]
  tags: [inventory, location]
  gold_sql: |
    SELECT il."Location",
           COUNT(DISTINCT il."Item") AS item_count,
           SUM(NULLIF(il."QuantityOnHand", '')::numeric * im."StandardCost") AS inventory_value
    FROM "tbl_item_location" il
    JOIN "tbl_item" im ON im."Item" = il."Item"
    WHERE il."Location" = '{location}'
      AND NULLIF(il."QuantityOnHand", '')::numeric > 0
      AND im."StandardCost" > 0
    GROUP BY il."Location";

- id: trx_loc_item_count
  family: 25
  difficulty: medium
  question: "How many items are stocked at location {location}?"
  tables: [tbl_item_location]
  columns: [tbl_item_location.Location, tbl_item_location.QuantityOnHand]
  tags: [inventory, location]
  gold_sql: |
    SELECT COUNT(DISTINCT "Item") AS item_count,
           SUM(CASE WHEN NULLIF("QuantityOnHand", '')::numeric > 0 THEN 1 ELSE 0 END) AS items_in_stock
    FROM "tbl_item_location"
    WHERE "Location" = '{location}';

- id: trx_loc_out_of_stock
  family: 25
  difficulty: medium
  question: "Which items at location {location} have zero quantity on hand?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item_location.Location, tbl_item_location.QuantityOnHand, tbl_item.Description]
  tags: [inventory, location]
  gold_sql: |
    SELECT il."Item", im."Description", im."Type",
           NULLIF(il."QuantityOnHand", '')::numeric AS qty_on_hand
    FROM "tbl_item_location" il
    JOIN "tbl_item" im ON im."Item" = il."Item"
    WHERE il."Location" = '{location}'
      AND (NULLIF(il."QuantityOnHand", '')::numeric IS NULL
           OR NULLIF(il."QuantityOnHand", '')::numeric <= 0)
    ORDER BY il."Item";

- id: trx_loc_topn_items
  family: 25
  difficulty: medium
  question: "What are the top {n} items by quantity on hand at location {location}?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item_location.Location, tbl_item_location.QuantityOnHand, tbl_item.Description]
  tags: [inventory, location, top_n]
  gold_sql: |
    SELECT il."Item", im."Description", im."Type",
           NULLIF(il."QuantityOnHand", '')::numeric AS qty_on_hand
    FROM "tbl_item_location" il
    JOIN "tbl_item" im ON im."Item" = il."Item"
    WHERE il."Location" = '{location}'
      AND NULLIF(il."QuantityOnHand", '')::numeric > 0
    ORDER BY NULLIF(il."QuantityOnHand", '')::numeric DESC NULLS LAST
    LIMIT {n};

- id: trx_loc_reorder_needed
  family: 25
  difficulty: medium
  question: "Which items at location {location} are below their minimum shelf quantity?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item_location.Location, tbl_item_location.QuantityOnHand, tbl_item_location.MinShelfQty, tbl_item.Description]
  tags: [inventory, location]
  gold_sql: |
    SELECT il."Item", im."Description",
           NULLIF(il."QuantityOnHand", '')::numeric AS qty_on_hand,
           NULLIF(il."MinShelfQty", '')::numeric AS min_shelf_qty
    FROM "tbl_item_location" il
    JOIN "tbl_item" im ON im."Item" = il."Item"
    WHERE il."Location" = '{location}'
      AND NULLIF(il."MinShelfQty", '')::numeric > 0
      AND (
        NULLIF(il."QuantityOnHand", '')::numeric IS NULL
        OR NULLIF(il."QuantityOnHand", '')::numeric < NULLIF(il."MinShelfQty", '')::numeric
      )
    ORDER BY (NULLIF(il."QuantityOnHand", '')::numeric - NULLIF(il."MinShelfQty", '')::numeric) ASC NULLS FIRST;

- id: trx_loc_so_shipped_year
  family: 25
  difficulty: hard
  question: "How many sales orders were shipped from location {location} in {year}?"
  tables: [tbl_invoice]
  columns: [tbl_invoice.ShipFromLocation, tbl_invoice.InvoiceDate]
  tags: [sales_orders, location, temporal]
  gold_sql: |
    SELECT "ShipFromLocation",
           COUNT(*) AS invoice_count,
           SUM("InvoiceAmount") AS total_invoiced
    FROM "tbl_invoice"
    WHERE "ShipFromLocation" = '{location}'
      AND EXTRACT(YEAR FROM "InvoiceDate") = {year}
    GROUP BY "ShipFromLocation";

# ============================================================
# Family 26: Work order analysis (medium/hard) — some with {wo_status}
# ============================================================

- id: trx_wo_by_status_detail
  family: 26
  difficulty: medium
  question: "How many work orders are in {wo_status} status by work center?"
  tables: [tbl_work_order]
  columns: [tbl_work_order.AssemblyStatus, tbl_work_order.WorkCenter]
  tags: [warehouse, aggregation]
  gold_sql: |
    SELECT "WorkCenter", COUNT(*) AS wo_count
    FROM "tbl_work_order"
    WHERE "AssemblyStatus" = '{wo_status}'
      AND "WorkCenter" IS NOT NULL
    GROUP BY "WorkCenter"
    ORDER BY wo_count DESC;

- id: trx_wo_component_cost_by_status
  family: 26
  difficulty: hard
  question: "What is the total estimated component cost for {wo_status} work orders?"
  tables: [tbl_work_order, tbl_work_order_item]
  columns: [tbl_work_order.AssemblyStatus, tbl_work_order_item.EstimatedExtendedCost]
  tags: [warehouse, aggregation]
  gold_sql: |
    SELECT w."AssemblyStatus",
           COUNT(DISTINCT w."WorkOrderNumber") AS wo_count,
           COUNT(wi."ComponentID") AS component_count,
           SUM(wi."EstimatedExtendedCost") AS total_est_cost
    FROM "tbl_work_order" w
    JOIN "tbl_work_order_item" wi ON wi."WorkOrderNumber" = w."WorkOrderNumber"
    WHERE w."AssemblyStatus" = '{wo_status}'
    GROUP BY w."AssemblyStatus";

- id: trx_wo_avg_components
  family: 26
  difficulty: medium
  question: "What is the average number of components per work order by assembly status?"
  tables: [tbl_work_order, tbl_work_order_item]
  columns: [tbl_work_order.AssemblyStatus, tbl_work_order_item.WorkOrderNumber]
  tags: [warehouse, aggregation]
  gold_sql: |
    SELECT w."AssemblyStatus",
           COUNT(DISTINCT w."WorkOrderNumber") AS wo_count,
           COUNT(wi."ComponentID") AS total_components,
           ROUND(COUNT(wi."ComponentID")::numeric / NULLIF(COUNT(DISTINCT w."WorkOrderNumber"), 0), 1) AS avg_components
    FROM "tbl_work_order" w
    JOIN "tbl_work_order_item" wi ON wi."WorkOrderNumber" = w."WorkOrderNumber"
    GROUP BY w."AssemblyStatus"
    ORDER BY wo_count DESC;

- id: trx_wo_top_items_by_cost
  family: 26
  difficulty: hard
  question: "What are the top {n} items by total estimated work order cost?"
  tables: [tbl_work_order_item, tbl_item]
  columns: [tbl_work_order_item.Item, tbl_work_order_item.EstimatedExtendedCost, tbl_item.Description]
  tags: [warehouse, inventory, top_n]
  gold_sql: |
    SELECT wi."Item", im."Description",
           COUNT(DISTINCT wi."WorkOrderNumber") AS wo_count,
           SUM(wi."EstimatedExtendedCost") AS total_est_cost
    FROM "tbl_work_order_item" wi
    JOIN "tbl_item" im ON im."Item" = wi."Item"
    WHERE wi."Item" IS NOT NULL AND wi."Item" != ''
    GROUP BY wi."Item", im."Description"
    ORDER BY total_est_cost DESC NULLS LAST
    LIMIT {n};

# ============================================================
# Family 27: GL / financial analysis (hard) — some with {year}
# ============================================================

- id: trx_gl_net_by_account_year
  family: 27
  difficulty: hard
  question: "What is the net GL balance (debits minus credits) by account in {year}?"
  tables: [tbl_je_line_item, tbl_gl_account]
  columns: [tbl_je_line_item.AccountNumber, tbl_je_line_item.DebitAmount, tbl_je_line_item.CreditAmount, tbl_je_line_item.TransactionDate, tbl_gl_account.Description]
  tags: [general_ledger, temporal]
  gold_sql: |
    SELECT je."AccountNumber", a."Description", a."AccountType",
           SUM(je."DebitAmount") AS total_debits,
           SUM(je."CreditAmount") AS total_credits,
           SUM(je."DebitAmount") - SUM(je."CreditAmount") AS net_balance
    FROM "tbl_je_line_item" je
    JOIN "tbl_gl_account" a ON a."AccountId" = je."AccountNumber"
    WHERE EXTRACT(YEAR FROM je."TransactionDate") = {year}
    GROUP BY je."AccountNumber", a."Description", a."AccountType"
    ORDER BY net_balance DESC;

- id: trx_gl_by_location_year
  family: 27
  difficulty: hard
  question: "What is the total GL posting amount by location in {year}?"
  tables: [tbl_je_line_item]
  columns: [tbl_je_line_item.Location, tbl_je_line_item.DebitAmount, tbl_je_line_item.TransactionDate]
  tags: [general_ledger, temporal]
  gold_sql: |
    SELECT "Location",
           COUNT(*) AS entry_count,
           SUM("DebitAmount") AS total_debits,
           SUM("CreditAmount") AS total_credits
    FROM "tbl_je_line_item"
    WHERE EXTRACT(YEAR FROM "TransactionDate") = {year}
      AND "Location" IS NOT NULL
    GROUP BY "Location"
    ORDER BY total_debits DESC;

- id: trx_gl_expense_accounts_year
  family: 27
  difficulty: hard
  question: "What is the total expense posted to each expense GL account in {year}?"
  tables: [tbl_je_line_item, tbl_gl_account]
  columns: [tbl_je_line_item.AccountNumber, tbl_je_line_item.DebitAmount, tbl_je_line_item.TransactionDate, tbl_gl_account.AccountType]
  tags: [general_ledger, temporal]
  gold_sql: |
    SELECT je."AccountNumber", a."Description",
           SUM(je."DebitAmount") AS total_debits
    FROM "tbl_je_line_item" je
    JOIN "tbl_gl_account" a ON a."AccountId" = je."AccountNumber"
    WHERE a."AccountType" = 'EXP'
      AND EXTRACT(YEAR FROM je."TransactionDate") = {year}
    GROUP BY je."AccountNumber", a."Description"
    ORDER BY total_debits DESC;

# ============================================================
# Family 28: Correlated subquery / comparison (hard)
# ============================================================

- id: trx_corr_items_above_avg_cost
  family: 28
  difficulty: hard
  question: "Which stock items have a standard cost above the average?"
  tables: [tbl_item]
  columns: [tbl_item.Type, tbl_item.StandardCost]
  tags: [inventory, correlated_subquery]
  gold_sql: |
    SELECT "Item", "Description", "StandardCost"
    FROM "tbl_item"
    WHERE "Type" = 'STOCK'
      AND "StandardCost" > (
        SELECT AVG("StandardCost") FROM "tbl_item" WHERE "Type" = 'STOCK' AND "StandardCost" > 0
      )
    ORDER BY "StandardCost" DESC;

- id: trx_corr_customers_above_avg_ar
  family: 28
  difficulty: hard
  question: "Which customers have an AR balance above the average?"
  tables: [tbl_customer]
  columns: [tbl_customer.ARBalance]
  tags: [customers, accounts_receivable, correlated_subquery]
  gold_sql: |
    SELECT "Customer", "Name", "ARBalance"
    FROM "tbl_customer"
    WHERE "ARBalance" > (
      SELECT AVG("ARBalance") FROM "tbl_customer" WHERE "ARBalance" IS NOT NULL AND "ARBalance" > 0
    )
    ORDER BY "ARBalance" DESC;

- id: trx_corr_vendors_above_avg_ap
  family: 28
  difficulty: hard
  question: "Which vendors have an AP balance above the average?"
  tables: [tbl_vendor]
  columns: [tbl_vendor.APBalance]
  tags: [vendors, accounts_payable, correlated_subquery]
  gold_sql: |
    SELECT "Vendor", "Name", "APBalance"
    FROM "tbl_vendor"
    WHERE "APBalance" > (
      SELECT AVG("APBalance") FROM "tbl_vendor" WHERE "APBalance" IS NOT NULL AND "APBalance" > 0
    )
    ORDER BY "APBalance" DESC;

- id: trx_corr_so_above_avg_lines
  family: 28
  difficulty: hard
  question: "Which open sales orders have more lines than the average?"
  tables: [tbl_sales_order, tbl_so_line]
  columns: [tbl_sales_order.Status, tbl_so_line.SONumber]
  tags: [sales_orders, correlated_subquery]
  gold_sql: |
    SELECT s."SONumber", s."CustomerShipTo", s."DateOrdered",
           COUNT(l."SOLineNumber") AS line_count
    FROM "tbl_sales_order" s
    JOIN "tbl_so_line" l ON l."SONumber" = s."SONumber"
    WHERE s."Status" = 'OPEN'
    GROUP BY s."SONumber", s."CustomerShipTo", s."DateOrdered"
    HAVING COUNT(l."SOLineNumber") > (
      SELECT AVG(lc) FROM (
        SELECT COUNT(*) AS lc FROM "tbl_so_line"
        JOIN "tbl_sales_order" ON "tbl_sales_order"."SONumber" = "tbl_so_line"."SONumber"
        WHERE "tbl_sales_order"."Status" = 'OPEN'
        GROUP BY "tbl_so_line"."SONumber"
      ) sub
    )
    ORDER BY line_count DESC;

# ============================================================
# Family 29: Commission analysis (medium/hard)
# ============================================================

- id: trx_comm_by_rep_year
  family: 29
  difficulty: hard
  question: "What is the total commission amount by sales rep in {year}?"
  tables: [tbl_tiered_commission, tbl_sales_rep, tbl_invoice]
  columns: [tbl_tiered_commission.SalesRep, tbl_tiered_commission.CommissionPct, tbl_invoice.InvoiceAmount, tbl_invoice.InvoiceDate, tbl_sales_rep.Name]
  tags: [commissions, temporal]
  gold_sql: |
    SELECT r."Name" AS rep_name,
           COUNT(c."InvoiceNumber") AS invoice_lines,
           ROUND(AVG(c."CommissionPct"), 4) AS avg_commission_pct
    FROM "tbl_tiered_commission" c
    JOIN "tbl_sales_rep" r ON r."SalesRep" = c."SalesRep"
    JOIN "tbl_invoice" i ON i."InvoiceNumber" = c."InvoiceNumber"
    WHERE EXTRACT(YEAR FROM i."InvoiceDate") = {year}
    GROUP BY r."Name"
    ORDER BY invoice_lines DESC;

- id: trx_comm_rep_by_customer_year
  family: 29
  difficulty: hard
  question: "How many commission lines does each sales rep have per customer in {year}?"
  tables: [tbl_tiered_commission, tbl_sales_rep, tbl_invoice, tbl_customer]
  columns: [tbl_tiered_commission.SalesRep, tbl_invoice.Customer, tbl_invoice.InvoiceDate, tbl_sales_rep.Name, tbl_customer.Name]
  tags: [commissions, customers, temporal]
  gold_sql: |
    SELECT r."Name" AS rep_name,
           c."Name" AS customer_name,
           COUNT(cr."InvoiceNumber") AS commission_lines
    FROM "tbl_tiered_commission" cr
    JOIN "tbl_sales_rep" r ON r."SalesRep" = cr."SalesRep"
    JOIN "tbl_invoice" i ON i."InvoiceNumber" = cr."InvoiceNumber"
    JOIN "tbl_customer" c ON c."Customer" = i."Customer"
    WHERE EXTRACT(YEAR FROM i."InvoiceDate") = {year}
    GROUP BY r."Name", c."Name"
    ORDER BY commission_lines DESC
    LIMIT 20;

# ============================================================
# Family 30: Item-location multi-analysis (medium)
# ============================================================

- id: trx_itemloc_multi_location_items
  family: 30
  difficulty: medium
  question: "Which items are stocked at both HUDW and BENSON?"
  tables: [tbl_item_location]
  columns: [tbl_item_location.Item, tbl_item_location.Location]
  tags: [inventory, location]
  gold_sql: |
    SELECT il1."Item"
    FROM "tbl_item_location" il1
    WHERE il1."Location" = 'HUDW'
      AND EXISTS (
        SELECT 1 FROM "tbl_item_location" il2
        WHERE il2."Item" = il1."Item" AND il2."Location" = 'BENSON'
      )
    ORDER BY il1."Item";

- id: trx_itemloc_dead_items
  family: 30
  difficulty: medium
  question: "Which items are marked as dead (IsDead) at any location?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item_location.IsDead, tbl_item.Description]
  tags: [inventory, lookup]
  gold_sql: |
    SELECT DISTINCT il."Item", im."Description", im."Type",
           COUNT(il."Location") AS dead_location_count
    FROM "tbl_item_location" il
    JOIN "tbl_item" im ON im."Item" = il."Item"
    WHERE il."IsDead" = true
    GROUP BY il."Item", im."Description", im."Type"
    ORDER BY dead_location_count DESC;

- id: trx_itemloc_qty_committed_hudw
  family: 30
  difficulty: medium
  question: "Which items at HUDW have committed quantity greater than on-hand quantity?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item_location.QuantityOnHand, tbl_item_location.QuantityCommitted, tbl_item_location.Location, tbl_item.Description]
  tags: [inventory, location]
  gold_sql: |
    SELECT il."Item", im."Description",
           NULLIF(il."QuantityOnHand", '')::numeric AS qty_on_hand,
           NULLIF(il."QuantityCommitted", '')::numeric AS qty_committed
    FROM "tbl_item_location" il
    JOIN "tbl_item" im ON im."Item" = il."Item"
    WHERE il."Location" = 'HUDW'
      AND NULLIF(il."QuantityCommitted", '')::numeric > 0
      AND (
        NULLIF(il."QuantityOnHand", '')::numeric IS NULL
        OR NULLIF(il."QuantityOnHand", '')::numeric < NULLIF(il."QuantityCommitted", '')::numeric
      )
    ORDER BY il."Item";


