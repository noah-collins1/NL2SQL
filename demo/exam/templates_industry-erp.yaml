# ============================================================
# Family 34: Inventory turnover and stock analysis (medium/hard)
# ============================================================

- id: trx_inv_stock_summary
  family: 34
  difficulty: medium
  question: "What is the total quantity on hand and inventory value by item type?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item.Type, tbl_item_location.QuantityOnHand, tbl_item.StandardCost]
  tags: [inventory, aggregation]
  gold_sql: |
    SELECT im."Type",
           COUNT(DISTINCT im."Item") AS item_count,
           SUM(NULLIF(il."QuantityOnHand", '')::numeric) AS total_qty_on_hand,
           SUM(NULLIF(il."QuantityOnHand", '')::numeric * im."StandardCost") AS total_value
    FROM "tbl_item" im
    JOIN "tbl_item_location" il ON il."Item" = im."Item"
    WHERE NULLIF(il."QuantityOnHand", '')::numeric > 0
      AND im."StandardCost" > 0
    GROUP BY im."Type"
    ORDER BY total_value DESC NULLS LAST;

- id: trx_inv_items_above_max
  family: 34
  difficulty: medium
  question: "Which items at HUDW have quantity on hand above the maximum shelf quantity?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item_location.QuantityOnHand, tbl_item_location.MaxShelfQty, tbl_item_location.Location, tbl_item.Description]
  tags: [inventory, location]
  gold_sql: |
    SELECT il."Item", im."Description",
           NULLIF(il."QuantityOnHand", '')::numeric AS qty_on_hand,
           NULLIF(il."MaxShelfQty", '')::numeric AS max_shelf_qty
    FROM "tbl_item_location" il
    JOIN "tbl_item" im ON im."Item" = il."Item"
    WHERE il."Location" = 'HUDW'
      AND NULLIF(il."MaxShelfQty", '')::numeric > 0
      AND NULLIF(il."QuantityOnHand", '')::numeric > NULLIF(il."MaxShelfQty", '')::numeric
    ORDER BY (NULLIF(il."QuantityOnHand", '')::numeric - NULLIF(il."MaxShelfQty", '')::numeric) DESC;

- id: trx_inv_qty_by_location_item
  family: 34
  difficulty: medium
  question: "What is the total quantity on hand for each item across all locations?"
  tables: [tbl_item_location, tbl_item]
  columns: [tbl_item_location.QuantityOnHand, tbl_item.Description, tbl_item.Type]
  tags: [inventory, aggregation]
  gold_sql: |
    SELECT il."Item", im."Description", im."Type",
           SUM(NULLIF(il."QuantityOnHand", '')::numeric) AS total_qty,
           COUNT(DISTINCT il."Location") AS location_count
    FROM "tbl_item_location" il
    JOIN "tbl_item" im ON im."Item" = il."Item"
    WHERE im."Type" = 'STOCK'
    GROUP BY il."Item", im."Description", im."Type"
    HAVING SUM(NULLIF(il."QuantityOnHand", '')::numeric) > 0
    ORDER BY total_qty DESC NULLS LAST
    LIMIT 20;

- id: trx_inv_items_all_locations_year
  family: 34
  difficulty: hard
  question: "Which items were ordered on SOs but have no stock at any location in {year}?"
  tables: [tbl_sales_order, tbl_so_line, tbl_item_location]
  columns: [tbl_so_line.Item, tbl_sales_order.DateOrdered, tbl_item_location.QuantityOnHand]
  tags: [inventory, anti_join, temporal]
  gold_sql: |
    SELECT DISTINCT sl."Item"
    FROM "tbl_so_line" sl
    JOIN "tbl_sales_order" s ON s."SONumber" = sl."SONumber"
    WHERE EXTRACT(YEAR FROM s."DateOrdered") = {year}
      AND sl."Item" IS NOT NULL AND sl."Item" != ''
      AND NOT EXISTS (
        SELECT 1 FROM "tbl_item_location" il
        WHERE il."Item" = sl."Item"
          AND NULLIF(il."QuantityOnHand", '')::numeric > 0
      )
    ORDER BY sl."Item";
