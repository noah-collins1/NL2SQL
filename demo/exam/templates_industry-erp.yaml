  tags: [customers, accounts_receivable, anti_join]
  gold_sql: |
    SELECT c."Customer", c."Name", c."ARBalance"
    FROM "tbl_customer" c
    WHERE NOT EXISTS (
      SELECT 1 FROM "tbl_invoice" i WHERE i."Customer" = c."Customer"
    )
    ORDER BY c."Name";

- id: trx_antijoin_vendors_no_voucher
