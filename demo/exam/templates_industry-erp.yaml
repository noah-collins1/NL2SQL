# ============================================================
# Family 15: More header-detail aggregation (medium)
# ============================================================

- id: trx_hdr_so_line_value
  family: 15
  difficulty: medium
  question: "What is the total line value of each open sales order?"
  tables: [tbl_sales_order, tbl_so_line]
  columns: [tbl_sales_order.Status, tbl_so_line.Quantity, tbl_so_line.UnitPriceCalculated]
  tags: [sales_orders, header_detail]
  gold_sql: |
    SELECT s."SONumber", s."CustomerShipTo", s."DateOrdered",
           COUNT(l."SOLineNumber") AS line_count,
           SUM(NULLIF(l."Quantity", '')::numeric * l."UnitPriceCalculated") AS total_value
    FROM "tbl_sales_order" s
    JOIN "tbl_so_line" l ON l."SONumber" = s."SONumber"
    WHERE s."Status" = 'OPEN'
    GROUP BY s."SONumber", s."CustomerShipTo", s."DateOrdered"
    ORDER BY total_value DESC NULLS LAST;

- id: trx_hdr_invoice_line_count
  family: 15
  difficulty: medium
  question: "How many lines does each open invoice have?"
  tables: [tbl_invoice, tbl_invoice_line]
  columns: [tbl_invoice.Status, tbl_invoice_line.InvoiceNumber]
  tags: [accounts_receivable, header_detail]
  gold_sql: |
    SELECT i."InvoiceNumber", i."Customer", i."InvoiceDate",
           i."InvoiceAmount", COUNT(il."InvoiceLineNumber") AS line_count
    FROM "tbl_invoice" i
    JOIN "tbl_invoice_line" il ON il."InvoiceNumber" = i."InvoiceNumber"
    WHERE i."Status" = 'OPEN'
    GROUP BY i."InvoiceNumber", i."Customer", i."InvoiceDate", i."InvoiceAmount"
    ORDER BY line_count DESC;

- id: trx_hdr_pt_item_count
  family: 15
  difficulty: medium
  question: "How many items were on each confirmed pick ticket?"
  tables: [tbl_pick_ticket, tbl_pick_ticket_line]
  columns: [tbl_pick_ticket.Status, tbl_pick_ticket_line.PickTicketNumber]
  tags: [warehouse, header_detail]
  gold_sql: |
    SELECT pt."PickTicketNumber", pt."Location", pt."DateShipped",
           COUNT(ptl."Item") AS item_count
    FROM "tbl_pick_ticket" pt
    JOIN "tbl_pick_ticket_line" ptl ON ptl."PickTicketNumber" = pt."PickTicketNumber"
    WHERE pt."Status" = 'CONFRM'
    GROUP BY pt."PickTicketNumber", pt."Location", pt."DateShipped"
    ORDER BY item_count DESC;

- id: trx_hdr_wip_component_count
  family: 15
  difficulty: medium
  question: "How many components does each in-assembly work order have?"
  tables: [tbl_work_order, tbl_work_order_item]
  columns: [tbl_work_order.AssemblyStatus, tbl_work_order_item.WorkOrderNumber]
  tags: [warehouse, header_detail]
  gold_sql: |
    SELECT w."WorkOrderNumber", w."Description", w."WorkCenter",
           COUNT(wi."ComponentID") AS component_count,
           SUM(wi."EstimatedExtendedCost") AS total_est_cost
    FROM "tbl_work_order" w
    JOIN "tbl_work_order_item" wi ON wi."WorkOrderNumber" = w."WorkOrderNumber"
    WHERE w."AssemblyStatus" = 'INASSY'
    GROUP BY w."WorkOrderNumber", w."Description", w."WorkCenter"
    ORDER BY component_count DESC;

- id: trx_hdr_so_qty_vs_shipped
  family: 15
  difficulty: medium
  question: "What is the total quantity ordered vs shipped per open sales order?"
  tables: [tbl_sales_order, tbl_so_line]
  columns: [tbl_sales_order.Status, tbl_so_line.Quantity, tbl_so_line.QuantityShipped]
  tags: [sales_orders, header_detail]
  gold_sql: |
    SELECT s."SONumber", s."CustomerShipTo",
           SUM(NULLIF(l."Quantity", '')::numeric) AS total_ordered,
           SUM(NULLIF(l."QuantityShipped", '')::numeric) AS total_shipped
    FROM "tbl_sales_order" s
    JOIN "tbl_so_line" l ON l."SONumber" = s."SONumber"
    WHERE s."Status" = 'OPEN'
    GROUP BY s."SONumber", s."CustomerShipTo"
    ORDER BY total_ordered DESC NULLS LAST;

- id: trx_hdr_po_receipt_pct
  family: 15
  difficulty: medium
  question: "What percentage of each open purchase order has been received?"
  tables: [tbl_purchase_order, tbl_purchase_order_line]
  columns: [tbl_purchase_order.Status, tbl_purchase_order_line.Quantity, tbl_purchase_order_line.QuantityReceived]
  tags: [purchasing, header_detail]
  gold_sql: |
    SELECT p."PONumber", p."VendorPurchaseFrom",
           SUM(NULLIF(l."Quantity", '')::numeric) AS total_ordered,
           SUM(NULLIF(l."QuantityReceived", '')::numeric) AS total_received,
           ROUND(
             100.0 * SUM(NULLIF(l."QuantityReceived", '')::numeric) /
             NULLIF(SUM(NULLIF(l."Quantity", '')::numeric), 0),
             1
           ) AS pct_received
    FROM "tbl_purchase_order" p
    JOIN "tbl_purchase_order_line" l ON l."PONumber" = p."PONumber"
    WHERE p."Status" = 'OPEN'
    GROUP BY p."PONumber", p."VendorPurchaseFrom"
    ORDER BY pct_received ASC NULLS LAST;

