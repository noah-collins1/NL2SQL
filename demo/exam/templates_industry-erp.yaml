- id: trx_antijoin_items_sold_not_purchased_year
  family: 18
  difficulty: hard
  question: "Which items were sold in {year} but never purchased in {year}?"
  tables: [tbl_so_line, tbl_sales_order, tbl_purchase_order_line, tbl_purchase_order]
