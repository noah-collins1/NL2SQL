# ============================================================
# Family 32: Item purchase history analysis (hard) — {year}
# ============================================================

- id: trx_item_sold_vs_purchased_year
  family: 32
  difficulty: hard
  question: "For each item, compare total quantity sold vs purchased in {year}."
  tables: [tbl_so_line, tbl_sales_order, tbl_purchase_order_line, tbl_purchase_order]
  columns: [tbl_so_line.Item, tbl_so_line.Quantity, tbl_sales_order.DateOrdered, tbl_purchase_order_line.Item, tbl_purchase_order_line.Quantity, tbl_purchase_order.OrderDate]
  tags: [inventory, temporal]
  gold_sql: |
    WITH sold AS (
      SELECT sl."Item",
             SUM(NULLIF(sl."Quantity", '')::numeric) AS qty_sold
      FROM "tbl_so_line" sl
      JOIN "tbl_sales_order" s ON s."SONumber" = sl."SONumber"
      WHERE EXTRACT(YEAR FROM s."DateOrdered") = {year}
        AND sl."Item" IS NOT NULL AND sl."Item" != ''
      GROUP BY sl."Item"
    ),
    purchased AS (
      SELECT pl."Item",
             SUM(NULLIF(pl."Quantity", '')::numeric) AS qty_purchased
      FROM "tbl_purchase_order_line" pl
      JOIN "tbl_purchase_order" p ON p."PONumber" = pl."PONumber"
      WHERE EXTRACT(YEAR FROM p."OrderDate") = {year}
        AND pl."Item" IS NOT NULL AND pl."Item" != ''
      GROUP BY pl."Item"
    )
    SELECT COALESCE(s."Item", p."Item") AS item,
           COALESCE(s.qty_sold, 0) AS qty_sold,
           COALESCE(p.qty_purchased, 0) AS qty_purchased
    FROM sold s
    FULL OUTER JOIN purchased p ON p."Item" = s."Item"
    ORDER BY COALESCE(s.qty_sold, 0) DESC NULLS LAST
    LIMIT 20;

- id: trx_item_invoice_revenue_by_month_year
  family: 32
  difficulty: hard
  question: "What is the monthly invoice revenue for the top items in {year}?"
  tables: [tbl_invoice, tbl_invoice_line]
  columns: [tbl_invoice_line.Item, tbl_invoice_line.Quantity, tbl_invoice_line.UnitPrice, tbl_invoice.InvoiceDate]
  tags: [inventory, accounts_receivable, temporal]
  gold_sql: |
    SELECT DATE_TRUNC('month', i."InvoiceDate") AS month,
           COUNT(DISTINCT il."Item") AS item_count,
           SUM(NULLIF(il."Quantity", '')::numeric * il."UnitPrice") AS total_revenue
    FROM "tbl_invoice" i
    JOIN "tbl_invoice_line" il ON il."InvoiceNumber" = i."InvoiceNumber"
    WHERE EXTRACT(YEAR FROM i."InvoiceDate") = {year}
      AND il."Item" IS NOT NULL AND il."Item" != ''
    GROUP BY month
    ORDER BY month;

- id: trx_item_cost_vs_price_year
  family: 32
  difficulty: hard
  question: "What is the average unit cost vs unit price for items invoiced in {year}?"
  tables: [tbl_invoice, tbl_invoice_line]
  columns: [tbl_invoice_line.Item, tbl_invoice_line.UnitPrice, tbl_invoice_line.Cost, tbl_invoice.InvoiceDate]
  tags: [inventory, accounts_receivable, temporal]
  gold_sql: |
    SELECT il."Item",
           AVG(il."UnitPrice") AS avg_unit_price,
           AVG(il."Cost") AS avg_unit_cost,
           AVG(il."UnitPrice" - il."Cost") AS avg_margin
    FROM "tbl_invoice" i
    JOIN "tbl_invoice_line" il ON il."InvoiceNumber" = i."InvoiceNumber"
    WHERE EXTRACT(YEAR FROM i."InvoiceDate") = {year}
      AND il."Item" IS NOT NULL AND il."Item" != ''
      AND il."UnitPrice" > 0
    GROUP BY il."Item"
    ORDER BY avg_margin DESC NULLS LAST
    LIMIT 20;

# ============================================================
# Family 33: SO/PO status transitions (medium) — {year}
