    )
    ORDER BY v."Name";

- id: trx_antijoin_so_no_pt
  family: 18
  difficulty: hard
  question: "Which open sales orders have no pick ticket?"
  tables: [tbl_sales_order, tbl_pick_ticket]
  columns: [tbl_sales_order.SONumber, tbl_sales_order.Status, tbl_pick_ticket.PickTicketNumber]
